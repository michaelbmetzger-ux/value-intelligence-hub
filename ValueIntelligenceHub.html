the Company has fully developed written job descriptions for all positions in the Company and they are tightly connected to the Company’s overall strategic and tactical plans. Score below a 5 to the extent the Company has no written job descriptions, or the descriptions are not current or are written around people rather than positions.`,dimension:`People`,subarea:`Organizational Structure`,weight:8},{id:`people-organizational-structure-has-organizational-structure-been-designed-around-tactical-plans`,text:`Has organizational structure been designed around tactical plans?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`People`,subarea:`Organizational Structure`,weight:8},{id:`people-organizational-structure-have-personnel-resources-been-analyzed-for-balance-throughout-company`,text:`Have personnel resources been analyzed for balance throughout Company?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`People`,subarea:`Organizational Structure`,weight:8},{id:`people-organizational-strategy-does-the-company-have-a-written-people-strategy`,text:`Does the Company have a written "People" strategy?`,guidance:`A “people” strategy would include such topics as a written description of the type of culture the Company is trying to create, detailed plans for the organizational structure as the Company grows, where additional training, new staff or more management will be needed at each incremental growth phase, what type of people will be recruited for specific future positions, what skill sets, education, and personalities will be sought, what compensation will look like, etc. Score a 5 here if the Company has some written current plans for the future “people” side of the business but they need to be expanded. Score above a 5 to the extent the Company has more developed written plans for both the short-term and long-term future and the plans are current. Score below a 5 to the extent the Company does not have any written plans, the plans are not current, or they only address the short-term.`,dimension:`People`,subarea:`Organizational Strategy`,weight:8},{id:`people-organizational-strategy-is-the-strategy-aligned-with-the-overall-business-plan-mission-and-visio`,text:`Is the strategy aligned with the overall business plan, mission, and vision?`,guidance:`The score here should not be higher than the score from the previous question but could be lower. A high score here would mean that the Company’s well-developed long-term and short-term people strategy is strongly aligned with the strategic frameworks of the overall Company and the other functional departments.`,dimension:`People`,subarea:`Organizational Strategy`,weight:8},{id:`people-organizational-strategy-have-tactical-plans-been-developed-to-execute-the-strategy`,text:`Have tactical plans been developed to execute the strategy?`,guidance:`The score here should not be higher than the score from the previous question but could be lower. A high score here would mean that the Company’s well-developed long-term and short-term operating strategy is strongly aligned with the overall strategic frameworks of the Company AND short-term and long-term tactical plans have been fully developed to ensure execution and accountability. Do the tactical plans identify key drivers that will be tracked and managed? The score here should not be higher than the score from the previous question but could be lower. A high score here would mean that short-term and long-term tactical plans have been fully developed to ensure execution and accountability, AND that the Company has identified the 5 or 6 key drivers that will be closely tracked and managed in order to achieve overall goals. For products produced in-house, does the Company have a reliable supplier base? Score a 5 here if the Company has had long-term relationships with its key suppliers and is confident that such suppliers are financially healthy and capable of fulfilling the Company’s needs over the next several years. Score above a 5 to the extent the Company reviews...`,dimension:`People`,subarea:`Organizational Strategy`,weight:8},{id:`people-organizational-strategy-are-the-tactical-plans-fully-reflected-in-the-company-s-budgets-and-proj`,text:`Are the tactical plans fully reflected in the Company's budgets and projections?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`People`,subarea:`Organizational Strategy`,weight:8},{id:`people-organizational-strategy-does-the-company-have-a-standard-interviewing-process-in-place`,text:`Does the Company have a standard interviewing process in place?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`People`,subarea:`Organizational Strategy`,weight:8},{id:`people-organizational-strategy-are-core-values-clear-and-used-in-interviewing-and-performance-managemen`,text:`Are core values clear and used in interviewing and performance management?`,guidance:`A high score here would indicate that the Company has developed, defined, and clearly and consistently communicated its core values to all employees and that such values have been woven into the Company’s interviewing and performance management processes. Score a 5 here if the Company has fully developed core values and they are loosely, but intentionally, utilized in interviews and performance management. Score above a 5 to the extent the Company has fully developed core values and they are more consistently utilized in recruiting, interviewing, and performance management activities. Score below a 5 to the extent the Company does not have fully developed core values, or they have not been clearly and consistently communicated to all employees and are not utilized in interviewing and performance management activities.`,dimension:`People`,subarea:`Organizational Strategy`,weight:8},{id:`people-continuous-does-the-company-have-formal-training-programs-for-its-employees`,text:`Does the Company have formal training programs for its employees?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`People`,subarea:`Continuous`,weight:8},{id:`people-continuous-does-the-company-provide-cross-training-for-its-employees`,text:`Does the Company provide cross-training for its employees?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`People`,subarea:`Continuous`,weight:8},{id:`people-continuous-are-employees-given-regular-feedback-regarding-their-performance`,text:`Are employees given regular feedback regarding their performance?`,guidance:`The most effective feedback to employees happens “in the moment” when they do something worthy of praise or something that warrants constructive or corrective action. “Catching” somebody doing a good job and praising them in front of their co-workers is highly effective in motivating all employees and building loyalty. Providing critical feedback in private gives employees the guidance they need to improve without embarrassment or humiliation, and also builds motivation and loyalty. Score a 5 here if the Company has a loose culture of providing “in the moment” feedback to employees but it is not exercised consistently or uniformly across the Company. Score above a 5 to the extent the Company has a more well-developed culture of providing routine feedback to employees and it is exercised consistently and uniformly across the Company. Score below a 5 to the extent the Company provides little or no regular feedback to employees and waits until the annual review to share good and bad feedback.`,dimension:`People`,subarea:`Continuous`,weight:8},{id:`people-continuous-are-annual-reviews-conducted-for-every-employee`,text:`Are annual reviews conducted for every employee?`,guidance:`Score a 5 here if the Company has a loose process for conducting annual reviews but has a lot of room for improvement in the formality and consistent application of review criteria and follow-up to the reviews. Score above a 5 to the extent the Company has a more well-developed process for conducting formal annual reviews for all employees, including management, and the reviews incorporate performance against the overall mission, vision, values, objectives, and tactical plans of the Company. Score below a 5 to the extent the Company only haphazardly and inconsistently conducts annual reviews and follow-ups, if at all, and/or doesn’t include all employees and management in the process and/or doesn’t incorporate performance against overall mission, vision, values, objectives, and tactical plans of the Company into its review process.`,dimension:`People`,subarea:`Continuous`,weight:8},{id:`people-continuous-is-continuous-learning-encouraged-as-a-part-of-everyday-business`,text:`Is continuous learning encouraged as a part of everyday business?`,guidance:`A high score here would indicate that the Company could identify examples of how continuous learning is encouraged, such as a program allowing employees to identify and rollout ideas for best practices, a program or regular practice of recognizing employees who take the initiative to learn more about their jobs or the Company, a reward system of some type for employees who excel in their learning programs, or regular and consistent reinforcement by the Company’s leadership about the importance of continuous learning. Score a 5 here if the Company has a loose process for encouraging continuous learning but has a lot of room for improvement in its formalization and/or implementation. Score above a 5 to the extent the Company has more formal continuous learning programs and applies them consistently across the whole company. Score below a 5 to the extent the Company only pays haphazard attention, if at all, to the importance of encouraging continuous learning as part of everyday business. Does the Company have formal employee recognition programs? Examples of employee recognition programs could include employee of the week/ or month/ or year, announcements of employee...`,dimension:`People`,subarea:`Continuous`,weight:8},{id:`people-continuous-is-there-a-formal-company-approach-to-identify-and-implement-best-practi`,text:`Is there a formal Company approach to identify and implement best practices?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`People`,subarea:`Continuous`,weight:8},{id:`people-incentive-programs-does-the-company-actively-recognize-employee-contributions`,text:`Does the Company actively recognize employee contributions?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`People`,subarea:`Incentive Programs`,weight:8},{id:`people-incentive-programs-does-the-company-have-an-employee-bonus-program`,text:`Does the Company have an employee bonus program?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`People`,subarea:`Incentive Programs`,weight:8},{id:`people-incentive-programs-does-the-company-have-any-other-programs-to-maintain-high-employee-engag`,text:`Does the Company have any other programs to maintain high employee engagement?`,guidance:`Examples might include bonus and/or profit-sharing programs, flexible work arrangements, time off bonuses, equity incentive programs, etc. Score a 5 here if the Company exercises some loosely applied initiatives for maintaining high employee engagement but nothing formalized and not enough to influence widespread culture. Score above 5 to the extent the Company has more formal programs for maintaining high employee engagement and they are applied consistently and predictably so they favorably impact overall employee engagement. Score below 5 to the extent the Company only has informal and discretionary programs, if any, to maintain high employee engagement and they are not consistently awarded so have little impact on building widespread employee morale or dedication.`,dimension:`People`,subarea:`Incentive Programs`,weight:8},{id:`people-incentive-programs-does-the-company-foster-a-promote-from-within-philosophy`,text:`Does the Company foster a "promote from within" philosophy?`,guidance:`The most effective “promote from within” philosophies would be connected to the “people strategy” in a way that identifies future positions that will need to be filled at certain points of growth, identifies existing employees who could fill those positions, and develops and executes plans to build the necessary skills and knowledge of the identified employees so they will be ready to assume the new positions at the appropriate times. Score a 5 here if the Company loosely follows a “promote from within” philosophy but does little to identify and train existing employees to prepare them for future growth opportunities. Score above 5 to the extent the Company has a more formal process to develop existing employees for anticipated future opportunities within the Company. Score below 5 to the extent the Company only haphazardly, if at all, tries to fill new positions with existing employees. People Policies and Procedures`,dimension:`People`,subarea:`Incentive Programs`,weight:8},{id:`people-incentive-programs-does-the-company-benchmark-compensation-benefit-plans-against-market`,text:`Does the Company benchmark compensation/benefit plans against market?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`People`,subarea:`Incentive Programs`,weight:8},{id:`people-incentive-programs-are-compensation-and-benefits-competitive-within-the-company-s-market`,text:`Are compensation and benefits competitive within the Company's market?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`People`,subarea:`Incentive Programs`,weight:8},{id:`people-people-policies-and-procedures-does-the-company-have-a-personnel-policies-manual`,text:`Does the Company have a personnel policies manual?`,guidance:`Score a 5 here if the Company has some personnel policies that have been written and provided to all employees, but the policies are not necessarily complete. Score above a 5 to the extent the Company maintains a fully developed written set of personnel policies. Score below a 5 to the extent the Company has no written personnel policies or what policies are written have not been uniformly distributed to and reviewed by the employees.`,dimension:`People`,subarea:`People Policies & Procedures`,weight:8},{id:`people-people-policies-and-procedures-has-the-manual-been-updated-within-the-last-year`,text:`Has the manual been updated within the last year?`,guidance:`The score here should not be higher than the score from the previous question but could be lower, since it needs to have a fully developed written policies manual in order to score highly in having updated it. If the Company has completely updated what amounts to only a partial polices manual, then score here the same as the previous question. If the Company has only partially updated what was already only a partial policies manual, score lower than the previous question.`,dimension:`People`,subarea:`People Policies & Procedures`,weight:8},{id:`people-people-policies-and-procedures-has-the-manual-been-reviewed-by-human-resources-attorney`,text:`Has the manual been reviewed by Human Resources attorney?`,guidance:`This is a “Yes” or “No” question but is a critical part of keeping personnel policies updated and compliant with changing employment laws.`,dimension:`People`,subarea:`People Policies & Procedures`,weight:8},{id:`people-people-policies-and-procedures-is-the-manual-provided-to-every-employee-and-signed-off-annually`,text:`Is the manual provided to every employee and signed-off annually?`,guidance:`his is a “Yes” or “No” question. The importance here is to ensure that the Company has established a track record of every employee being refreshed on the policies every year and re-acknowledging their understanding of the policies so they can never claim that they weren’t aware of a given policy claim they signed off years ago and didn’t understand it or forgot about it. Ability to Scale Organization`,dimension:`People`,subarea:`People Policies & Procedures`,weight:8},{id:`people-people-policies-and-procedures-is-there-a-standard-new-employee-on-boarding-process`,text:`Is there a standard new employee on-boarding process?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`People`,subarea:`People Policies & Procedures`,weight:8},{id:`people-ability-to-scale-organization-is-there-a-plentiful-supply-of-qualified-local-labor-for-key-functions`,text:`Is there a plentiful supply of qualified local labor for key functions?`,guidance:`As companies grow, they often encounter tight supplies of labor for key positions, whether it be line workers, management, or somewhere in the middle, and such tight supplies can constrain growth, or impact the company’s compensation structure, or create imbalances in the organization. Score a 5 here if the Company has some, but not major, concerns about the market outlook regarding the supply of labor for key positions. Score above a 5 to the extent the Company has little to no concern about the outlook for market supply of labor for key positions. Score below a 5 to the extent the Company has increasing concern about the outlook for market supply of labor for key positions.`,dimension:`People`,subarea:`Ability To Scale Organization`,weight:8},{id:`people-ability-to-scale-organization-what-is-the-average-educational-level-of-the-middle-managers`,text:`What is the average educational level of the Middle Managers?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`People`,subarea:`Ability To Scale Organization`,weight:8},{id:`people-ability-to-scale-organization-are-employees-at-all-levels-actively-groomed-for-next-higher-level`,text:`Are employees at all levels actively groomed for next higher level?`,guidance:`Companies that have programs to groom employees for advancement typically have better employee engagement and can also use such programs to evaluate the growth potential of existing employees based on their enthusiasm and aptitude for learning new skills. Even if the Company is not growing and, as a result, the growth potential of employees is limited, the process will likely have other meaningful benefits such as serving as a backup plan for any employee who becomes unable to fulfill their responsibilities or who leaves the Company. Score a 5 here if the Company has a loose process for actively grooming employees for higher levels but has much room for improvement in the process. Score above a 5 to the extent the Company’s process of grooming employees is more formalized and consistently applied, and also serves as an evaluation tool for future planning purposes. Score below a 5 to the extent the Company only haphazardly, if at all, grooms existing employees for higher levels prior to an urgent need to fill vacant positions. Does the Company have a qualified executive responsible for operations? A “Yes” answer here implies that the executive responsible for operations...`,dimension:`People`,subarea:`Ability To Scale Organization`,weight:8},{id:`people-ability-to-scale-organization-is-the-company-unionized`,text:`Is the Company unionized?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`People`,subarea:`Ability To Scale Organization`,weight:8},{id:`people-ability-to-scale-organization-if-unionized-is-the-union-contract-current`,text:`If unionized, is the union contract current?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`People`,subarea:`Ability To Scale Organization`,weight:8},{id:`people-ability-to-scale-organization-has-the-company-had-any-work-stoppages-within-last-5-years`,text:`Has the Company had any work stoppages within last 5 years?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`People`,subarea:`Ability To Scale Organization`,weight:8},{id:`people-ability-to-scale-organization-what-is-average-length-of-employment-within-the-company`,text:`What is average length of employment within the Company?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`People`,subarea:`Ability To Scale Organization`,weight:8},{id:`people-ability-to-scale-organization-describe-the-company-s-employee-turnover-rate`,text:`Describe the Company's employee turnover rate.`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`People`,subarea:`Ability To Scale Organization`,weight:6}]},{id:`operations`,name:`Operations`,icon:re,subareas:[`General`,`Operations Team`,`Operating Strategy`,`Supply Chain`,`Quality Assurance`,`Operating Efficiency`,`Operating Policies & Procedures`,`Ability To Scale`],questions:[{id:`operations-general-in-what-primary-regions-does-the-company-operate`,text:`In what primary regions does the Company operate?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`General`,weight:8},{id:`operations-general-australia-canada-china-india-japan-mexico-netherlands-united-states-of-a`,text:`Australia, Canada, China, India, Japan, Mexico, Netherlands, United States of America Global Middle East North America South America`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`General`,weight:6},{id:`operations-general-in-what-regions-do-the-company-s-primary-suppliers-operate`,text:`In what regions do the Company's primary suppliers operate?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`General`,weight:8},{id:`operations-operations-team-does-the-company-s-management-team-include-a-dedicated-operations-leader`,text:`Does the Company's management team include a dedicated operations leader?`,guidance:`The key word here is “dedicated”, meaning the executive’s exclusive responsibility is managing the marketing function for the Company. If the person who manages marketing also manages sales or another function, the answer here should be “No”. Remember that this is not a size dependent questionnaire, so it doesn’t necessarily mean the Company should have a “dedicated” marketing executive at the Company’s current stage but, as the Company grows, it will likely need a dedicated marketing leader at some point, which is a best practice standard.`,dimension:`Operations`,subarea:`Operations Team`,weight:8},{id:`operations-operations-team-if-yes-describe-the-educational-level-of-the-operations-leader`,text:`If "yes", describe the educational level of the operations leader.`,guidance:`
