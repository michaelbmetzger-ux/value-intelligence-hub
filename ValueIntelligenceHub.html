 the standard of a written operating strategy. A full operating strategy would include a 3-5-year outlook of how the Company wants to be positioned within its industry in terms of certain strategic frameworks. Does the Company want to be the low-cost provider and price leader? … the innovation leader? … the service and support leader? Depending on the preferred positioning, the Company will need to build its operations in different ways … different systems and processes, different types of employees with different skills and different personalities, different approaches to training and incentivizing, different levels of investment in facilities, equipment and automation, etc., all requiring different short-term and longer-term tactical planning and tight alignment and coordination with other functional departments to achieve the desired positioning. Score a 5 here if detailed rolling 12-month operating plans are prepared and the plans are updated at least quarterly, but no long-term operating strategic...`,dimension:`Operations`,subarea:`Operating Strategy`,weight:8},{id:`operations-operating-strategy-is-the-strategy-aligned-with-the-business-plan-mission-and-vision`,text:`Is the strategy aligned with the business plan, mission, and vision?`,guidance:`The score here should not be higher than the score from the previous question but could be lower. A high score here would mean that the Company’s well-developed long-term and short-term operating strategy is strongly aligned with the strategic frameworks of the overall Company and the other functional departments.`,dimension:`Operations`,subarea:`Operating Strategy`,weight:8},{id:`operations-operating-strategy-have-tactical-plans-been-developed-to-execute-the-strategy`,text:`Have tactical plans been developed to execute the strategy?`,guidance:`The score here should not be higher than the score from the previous question but could be lower. A high score here would mean that the Company’s well-developed long-term and short-term operating strategy is strongly aligned with the overall strategic frameworks of the Company AND short-term and long-term tactical plans have been fully developed to ensure execution and accountability. Do the tactical plans identify key drivers that will be tracked and managed? The score here should not be higher than the score from the previous question but could be lower. A high score here would mean that short-term and long-term tactical plans have been fully developed to ensure execution and accountability, AND that the Company has identified the 5 or 6 key drivers that will be closely tracked and managed in order to achieve overall goals. For products produced in-house, does the Company have a reliable supplier base? Score a 5 here if the Company has had long-term relationships with its key suppliers and is confident that such suppliers are financially healthy and capable of fulfilling the Company’s needs over the next several years. Score above a 5 to the extent the Company reviews...`,dimension:`Operations`,subarea:`Operating Strategy`,weight:8},{id:`operations-operating-strategy-are-the-tactical-plans-fully-reflected-in-the-budgets-and-projections`,text:`Are the tactical plans fully reflected in the budgets and projections?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Operating Strategy`,weight:8},{id:`operations-operating-strategy-to-what-extent-are-the-key-drivers-identified-tracked-and-managed`,text:`To what extent are the key drivers identified, tracked, and managed?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Operating Strategy`,weight:8},{id:`operations-operating-strategy-does-the-strategy-include-a-plan-to-leverage-green-sustainable-technolog`,text:`Does the strategy include a plan to leverage green/sustainable technologies and reduce energy use?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Operating Strategy`,weight:8},{id:`operations-supply-chain-describe-the-level-of-the-company-s-supplier-concentration`,text:`Describe the level of the Company's supplier concentration.`,guidance:`Score a 10 here if it would take 100 or more of the Company’s customers to account for 75% of sales. Score a 0 here if it would only take one customer to account for 75% of sales. For each increment of 10 fewer customers required to reach 75% of sales, decrease the score by 1 point from a starting point of 10. So, if it takes 50 customers to account for 75% of sales, the score would be a 5.`,dimension:`Operations`,subarea:`Supply Chain`,weight:6},{id:`operations-supply-chain-does-the-company-have-backups-available-for-all-key-suppliers`,text:`Does the Company have backups available for all key suppliers?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Supply Chain`,weight:8},{id:`operations-supply-chain-does-the-company-monitor-and-track-the-quality-of-key-suppliers`,text:`Does the Company monitor and track the quality of key suppliers?`,guidance:`Score a 5 here if the Company has a loose but consistent process to monitor and track the quality of its suppliers, including such factors as quality of materials and services, on-time deliveries, lead times, price consistencies, responsiveness, cultural and strategic fit, etc. Score above a 5 to the extent the Company has a more structured process to review its suppliers on a quarterly basis and actively collaborates with them in a continuous improvement process to ensure ongoing quality, efficiency, price competitiveness and cultural fit. Score below a 5 to the extent the Company only haphazardly monitors the quality of suppliers and does not measure and track performance criteria over time. Does the Company have alternate suppliers available? Score a 5 here if the Company has a loose process for identifying potential alternates to key suppliers and/or there are limited alternates available. Score above a 5 to the extent the Company has a more structured approach to identifying alternates to key suppliers, maintains relationships with them, and the list of alternates is plentiful, especially for critical supplies and services. Score below a 5 to the extent the Company...`,dimension:`Operations`,subarea:`Supply Chain`,weight:8},{id:`operations-supply-chain-describe-the-company-s-internal-supply-chain-support-services-among-depa`,text:`Describe the Company's internal supply chain (support services among departments).`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Supply Chain`,weight:6},{id:`operations-supply-chain-are-the-internal-support-systems-efficient-and-lean`,text:`Are the internal support systems efficient and lean?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Supply Chain`,weight:8},{id:`operations-quality-assurance-describe-the-company-s-quality-assurance-program`,text:`Describe the Company's quality assurance program.`,guidance:`Score a 5 here if the Company has a loose but consistent process for quality control, primarily to check for final product quality prior to shipment. Score above a 5 to the extent the Company has a more formalized quality control process whereby it tracks, reports, and manages multiple quality control factors beyond merely the product quality. Factors such as quality checks throughout the operating process, component drawings and specifications, production yields, and operating rates, among others that might be included. Score below a 5 to the extent the Company has little or no quality control process in place or functioning consistently.`,dimension:`Operations`,subarea:`Quality Assurance`,weight:6},{id:`operations-quality-assurance-describe-the-company-s-customer-service-standards`,text:`Describe the Company's customer service standards.`,guidance:`Score a 5 here if the Company has a loose but consistent process for establishing and maintaining its customer service standards. Score above a 5 to the extent the Company has a more formalized process with written standards for customer service of which everybody in the Company (not only Operations) is aware and to which everybody adheres. Standards might include response times for proposals, communication protocols, complaint resolution, support requests, etc. Score below a 5 to the extent the Company only haphazardly, if at all, pays attention to establishing, managing, and tracking customer service standards.`,dimension:`Operations`,subarea:`Quality Assurance`,weight:6},{id:`operations-quality-assurance-are-customer-service-standards-reviewed-and-updated-annually`,text:`Are customer service standards reviewed and updated annually?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Quality Assurance`,weight:8},{id:`operations-quality-assurance-does-the-company-track-and-measure-customer-satisfaction`,text:`Does the Company track and measure customer satisfaction?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Quality Assurance`,weight:8},{id:`operations-quality-assurance-is-there-a-quality-assurance-manager`,text:`Is there a Quality Assurance Manager?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Quality Assurance`,weight:8},{id:`operations-quality-assurance-do-all-employees-know-what-quality-looks-like`,text:`Do all employees know what "quality" looks like?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Quality Assurance`,weight:8},{id:`operations-quality-assurance-describe-the-company-s-preventative-maintenance-and-monitoring-program`,text:`Describe the Company's preventative maintenance and monitoring program.`,guidance:`Score a 5 here if the Company has a loose process for maintaining its production equipment but has much room for improvement and more formalization. Score above a 5 to the extent the Company’s preventative maintenance program is more formally developed, executed, and tracked. Score below a 5 to the extent the Company only haphazardly, if at all, engages in preventative maintenance of its production equipment and/or more often merely fixes equipment when it breaks down. Describe the Company's lean manufacturing initiatives. Score a 5 here if the Company has a loose process for identifying and implementing lean operating initiatives but has much room for more improvement and formalization. Score above a 5 to the extent the Company has a more formalized and written lean operating program for identifying, prioritizing, implementing, and tracking lean operating initiatives. Score below a 5 to the extent the Company only haphazardly, if at all, engages in any lean operating initiatives.`,dimension:`Operations`,subarea:`Quality Assurance`,weight:6},{id:`operations-quality-assurance-has-the-company-experienced-any-unusual-or-high-warranty-claims-or-write`,text:`Has the Company experienced any unusual or high warranty claims or write-offs?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Quality Assurance`,weight:8},{id:`operations-operating-efficiency-describe-the-company-s-process-of-monitoring-and-tracking-waste-or-ineff`,text:`Describe the Company's process of monitoring and tracking waste or inefficiencies.`,guidance:`Score a 5 here if the Company has a loose process for monitoring, tracking, and eliminating waste but has much room for more formalization and improvement. Score above a 5 to the extent the Company has a more formalized and written program for monitoring, tracking, and eliminate waste, whether it’s waste of material, energy, time, or other resources. Score below a 5 to the extent the Company only haphazardly, if at all, engages in any effort to monitor, track, and eliminate waste throughout the organization.`,dimension:`Operations`,subarea:`Operating Efficiency`,weight:6},{id:`operations-operating-efficiency-describe-the-company-s-continuous-improvement-initiatives`,text:`Describe the Company's continuous improvement initiatives.`,guidance:`Score a 5 here if the Company has a loose process for identifying and implementing continuous improvement initiatives but has much room for more improvement and formalization. Score above a 5 to the extent the Company has a more formalized and written program for identifying, prioritizing, implementing, and tracking continuous improvement initiatives. Score below a 5 to the extent the Company only haphazardly, if at all, engages in any continuous improvement initiatives.`,dimension:`Operations`,subarea:`Operating Efficiency`,weight:6},{id:`operations-operating-efficiency-what-of-customer-products-services-are-delivered-on-time`,text:`What % of customer products/services are delivered on-time?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Operating Efficiency`,weight:8},{id:`operations-operating-efficiency-what-of-products-services-incur-cost-overruns-or-are-unprofitable`,text:`What % of products/services incur cost overruns or are unprofitable?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Operating Efficiency`,weight:8},{id:`operations-operating-efficiency-what-is-the-magnitude-of-overruns-or-losses-when-they-do-occur`,text:`What is the % magnitude of overruns or losses when they do occur?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Operating Efficiency`,weight:8},{id:`operations-operating-efficiency-describe-company-s-process-of-managing-inventory-levels`,text:`Describe Company's process of managing inventory levels.`,guidance:`Score a 5 here if the Company has a loose process for managing inventory levels but has much room for more formalization and improvement. Score above a 5 to the extent the Company has a more formalized and written program for managing inventory levels, with established objectives and goals that are tracked and reported on a regular basis. Score below a 5 to the extent the Company only haphazardly, if at all, engages in any effort to manage inventory levels. Operating Policies and Procedures Do the Company's operations pose inherent environmental risks? Score a 5 here if the Company’s operations pose some inherent environmental risk but not at a level that causes serious concerns by the Company, its customers, suppliers, or environmental authorities. Score above a 5 to the extent the Company’s operations pose very minor or no inherent environmental risk. Score below a 5 to the extent the Company’s operations pose a more significant/ serious inherent environmental risk that requires regular involvement by environmental authorities to monitor and track remediation. Ability to Scale`,dimension:`Operations`,subarea:`Operating Efficiency`,weight:6},{id:`operations-operating-policies-and-procedures-are-written-operations-policies-and-procedures-in-place-and-enforced`,text:`Are written operations policies and procedures in place and enforced?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Operating Policies & Procedures`,weight:8},{id:`operations-operating-policies-and-procedures-are-the-policies-and-procedures-reviewed-regularly-and-kept-current`,text:`Are the policies and procedures reviewed regularly and kept current?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Operating Policies & Procedures`,weight:8},{id:`operations-operating-policies-and-procedures-do-the-company-s-operations-pose-any-inherent-ethical-regulatory-environ`,text:`Do the Company's operations pose any inherent ethical, regulatory, environmental, safety, or other key risks?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Operating Policies & Procedures`,weight:8},{id:`operations-operating-policies-and-procedures-to-what-degree-do-the-company-s-operating-policies-and-procedures-addres`,text:`To what degree do the Company's operating policies and procedures address all inherent risks?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Operating Policies & Procedures`,weight:8},{id:`operations-ability-to-scale-does-the-company-have-a-relatively-high-or-low-fixed-cost-structure`,text:`Does the Company have a relatively high or low fixed cost structure?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Ability To Scale`,weight:8},{id:`operations-ability-to-scale-are-the-company-s-products-services-low-margin-or-high-margin`,text:`Are the Company's products/services low margin or high margin?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Ability To Scale`,weight:8},{id:`operations-ability-to-scale-how-much-of-the-company-s-products-and-services-are-custom-made-or-deliv`,text:`How much of the Company's products and services are custom made or delivered and not readily repeatable?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Ability To Scale`,weight:8},{id:`operations-ability-to-scale-do-physical-facility-small-remote-old-barriers-exist-to-expanding-operat`,text:`Do physical facility (small, remote, old) barriers exist to expanding operations?`,guidance:`Score each of these categories on a scale of 1 – 10, with 10 meaning that the category presents NO barrier to expanding operating capacity, a 5 meaning that the category presents some barrier but not to an extreme level and a 0 meaning that the category presents a significant barrier to expanding operating capacity.`,dimension:`Operations`,subarea:`Ability To Scale`,weight:8},{id:`operations-ability-to-scale-do-equipment-limitation-old-or-inefficient-barriers-exist-to-expanding-o`,text:`Do equipment limitation (old or inefficient) barriers exist to expanding operations?`,guidance:`Score each of these categories on a scale of 1 – 10, with 10 meaning that the category presents NO barrier to expanding manufacturing capacity, a 5 meaning that the category presents some barrier but not to an extreme level and a 0 meaning that the category presents a significant barrier to expanding manufacturing capacity. Do Supply chain limitation (source, quality, timing) barriers exist to expanding mfg. capacity? Score each of these categories on a scale of 1 – 10, with 10 meaning that the category presents NO barrier to expanding operating capacity, a 5 meaning that the category presents some barrier but not to an extreme level and a 0 meaning that the category presents a significant barrier to expanding operating capacity. Do Manufacturing process (setup time, too many SKUs) barriers exist to expanding mfg. capacity? Score each of these categories on a scale of 1 – 10, with 10 meaning that the category presents NO barrier to expanding manufacturing capacity, a 5 meaning that the category presents some barrier but not to an extreme level and a 0 meaning that the category presents a significant barrier to expanding manufacturing capacity. Do Labor availability...`,dimension:`Operations`,subarea:`Ability To Scale`,weight:8},{id:`operations-ability-to-scale-do-supply-chain-or-vendor-subcontractor-limitations-source-quality-timin`,text:`Do supply chain or vendor/subcontractor limitations (source, quality, timing) barriers exist to expanding operations?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Ability To Scale`,weight:8},{id:`operations-ability-to-scale-do-recruiting-barriers-skills-relationships-competition-exist-to-expandi`,text:`Do recruiting barriers (skills, relationships, competition) exist to expanding operations?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Ability To Scale`,weight:8},{id:`operations-ability-to-scale-do-technology-barriers-exist-to-expanding-operations`,text:`Do technology barriers exist to expanding operations?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Ability To Scale`,weight:8},{id:`operations-ability-to-scale-do-other-barriers-exist-to-expanding-operations`,text:`Do other barriers exist to expanding operations?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Ability To Scale`,weight:8},{id:`operations-ability-to-scale-describe-the-company-s-relationship-with-its-landlord`,text:`Describe the Company's relationship with its landlord.`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Ability To Scale`,weight:6},{id:`operations-ability-to-scale-will-the-company-have-to-relocate-within-the-next-3-years`,text:`Will the Company have to relocate within the next 3 years?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Operations`,subarea:`Ability To Scale`,weight:8}]},{id:`finance`,name:`Finance`,icon:xe,subareas:[`Finance Team`,`Finance Strategy`,`Planning, Analysis & Reporting`,`Financial Sustainability`,`Balance Sheet`,`Internal Controls`,`Information Systems`,`Risk Management`],questions:[{id:`finance-finance-team-does-the-company-s-management-team-include-a-dedicated-cfo-or-controller`,text:`Does the Company's management team include a dedicated CFO or Controller?`,guidance:`The key word here is “dedicated”, meaning the executive’s exclusive responsibility is managing the marketing function for the Company. If the person who manages marketing also manages sales or another function, the answer here should be “No”. Remember that this is not a size dependent questionnaire, so it doesn’t necessarily mean the Company should have a “dedicated” marketing executive at the Company’s current stage but, as the Company grows, it will likely need a dedicated marketing leader at some point, which is a best practice standard.`,dimension:`Finance`,subarea:`Finance Team`,weight:8},{id:`finance-finance-team-is-either-the-cfo-or-controller-a-cpa`,text:`Is either the CFO or Controller a CPA?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Finance Team`,weight:8},{id:`finance-finance-team-what-is-the-average-educational-level-of-the-cfo-and-controller`,text:`What is the average educational level of the CFO and Controller?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Finance Team`,weight:8},{id:`finance-finance-team-what-is-the-average-experience-level-of-the-cfo-and-controller`,text:`What is the average experience level of the CFO and Controller?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Finance Team`,weight:8},{id:`finance-finance-team-is-the-company-in-financial-transition-ie-rapid-growth-pivoting-downsizi`,text:`Is the Company in financial transition (ie: rapid growth, pivoting, downsizing)?`,guidance:`A “No” answer would apply here if the Company’s revenue has not been growing by more than 10% per year or declining by more than 5% per year for the last 2-3 years and is not expected to exceed those rates of growth or decline in the next 2-3 years.`,dimension:`Finance`,subarea:`Finance Team`,weight:8},{id:`finance-finance-team-if-yes-are-the-cfo-controller-experienced-in-similar-challenges`,text:`If "yes", are the CFO/Controller experienced in similar challenges?`,guidance:`The challenges of rapid growth or downsizing are each very different from the ordinary challenges of being in a “steady state” stage, and financial decisions that are prudent in a steady state stage may, in fact, be detrimental in a rapid growth or downsizing stage. If the CFO and/or Controller are not experienced in such challenges, they may need additional training or outside support to ensure they are properly guiding the Company with prudent decisions.`,dimension:`Finance`,subarea:`Finance Team`,weight:8},{id:`finance-finance-strategy-does-the-company-have-a-fully-developed-written-finance-strategy`,text:`Does the Company have a fully developed, written finance strategy?`,guidance:`Many companies develop one-year financial plans as part of their annual budgeting process. That activity is considered more tactical than strategic and would not meet the standard of a written finance strategy. A full finance strategy would include a 3-5-year outlook of how the Company wants to be structured financially in such areas as the proportion of equity and debt in its capital structure, establishing a target cost of capital / investment hurdle rate, how it will finance future growth, how it will evaluate future growth and capital investment decisions for the whole company, and what the finance department will need to do to help the Company achieve its overall objectives. All these types of decisions must also be aligned with the strategic plans from the other functional departments so that everybody is aligned and moving the Company forward together. Score a 5 here if detailed rolling 12-month financial plans are prepared and the plans are updated at least quarterly, but no long-term operating strategic frameworks or long-term positioning objectives have been developed. Score above a 5 here if, in addition to rolling 12-month tactical financial plans, the...`,dimension:`Finance`,subarea:`Finance Strategy`,weight:8},{id:`finance-finance-strategy-is-the-strategy-aligned-with-the-overall-business-plan-mission-and-visio`,text:`Is the strategy aligned with the overall business plan, mission, and vision?`,guidance:`The score here should not be higher than the score from the previous question but could be lower. A high score here would mean that the Company’s well-developed long-term and short-term people strategy is strongly aligned with the strategic frameworks of the overall Company and the other functional departments.`,dimension:`Finance`,subarea:`Finance Strategy`,weight:8},{id:`finance-finance-strategy-have-tactical-plans-been-developed-to-execute-the-strategy`,text:`Have tactical plans been developed to execute the strategy?`,guidance:`The score here should not be higher than the score from the previous question but could be lower. A high score here would mean that the Company’s well-developed long-term and short-term operating strategy is strongly aligned with the overall strategic frameworks of the Company AND short-term and long-term tactical plans have been fully developed to ensure execution and accountability. Do the tactical plans identify key drivers that will be tracked and managed? The score here should not be higher than the score from the previous question but could be lower. A high score here would mean that short-term and long-term tactical plans have been fully developed to ensure execution and accountability, AND that the Company has identified the 5 or 6 key drivers that will be closely tracked and managed in order to achieve overall goals. For products produced in-house, does the Company have a reliable supplier base? Score a 5 here if the Company has had long-term relationships with its key suppliers and is confident that such suppliers are financially healthy and capable of fulfilling the Company’s needs over the next several years. Score above a 5 to the extent the Company reviews...`,dimension:`Finance`,subarea:`Finance Strategy`,weight:8},{id:`finance-finance-strategy-are-the-tactical-plans-fully-reflected-in-the-budgets-and-projections`,text:`Are the tactical plans fully reflected in the budgets and projections?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Finance Strategy`,weight:8},{id:`finance-finance-strategy-to-what-extent-are-key-drivers-identified-tracked-and-managed`,text:`To what extent are key drivers identified, tracked, and managed?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Finance Strategy`,weight:8},{id:`finance-finance-strategy-does-the-strategy-include-a-targeted-capital-structure`,text:`Does the strategy include a targeted capital structure?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Finance Strategy`,weight:8},{id:`finance-finance-strategy-does-the-strategy-include-a-targeted-cost-of-capital`,text:`Does the strategy include a targeted cost of capital?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Finance Strategy`,weight:8},{id:`finance-finance-strategy-does-the-strategy-include-a-plan-for-financing-long-term-growth`,text:`Does the strategy include a plan for financing long term growth?`,guidance:`If the Company does not have a written finance strategy, the answer here would automatically be “N/A”. A plan for financing long-term growth would include a written document that establishes how much capital (internally generated or externally sourced) will be needed to finance future growth, when it will be needed, for what specific purposes, and how much will be targeted to come from internally generated cash flow vs externally sourced debt and/or equity. The blend of financing sources should be aligned with the targeted capital structure, targeted hurdle rates, and targeted returns on invested capital.`,dimension:`Finance`,subarea:`Finance Strategy`,weight:8},{id:`finance-finance-strategy-is-there-a-formal-process-for-assessing-new-business-opportunities`,text:`Is there a formal process for assessing new business opportunities?`,guidance:`A formal process would include members of the management team each assessing how the subject new business opportunity or investment would impact their functional departments, the performance metrics for their departments, and how the opportunity would move the Company closer toward its overall long-term objectives. This process is not intended for everyday onboarding of new customers in the normal course of business, but rather for significant opportunities that are outside of the normal course and have the potential to impact the Company in a significant way. Score a 5 here if the Company has a loose process of obtaining the input of the management team for major new business opportunities / investments but has much room for improvement and more formalization in its process. Score above a 5 to the extent the Company has a more formalized process for each department to assess and report on the impact of a contemplated new opportunity or investment on their functional area. Score below a 5 to the extent that the Company has only a haphazard process, if at all, for obtaining the input of the management team on significant new opportunities or investments. Planning,...`,dimension:`Finance`,subarea:`Finance Strategy`,weight:8},{id:`finance-planning-analysis-and-reporting-does-the-company-get-an-annual-independent-audit-or-review`,text:`Does the Company get an annual independent audit or review?`,guidance:`Whether or not a company has undergone an annual independent audit or review could be a critical factor in the process of securing new debt or equity growth capital or in selling the company, especially if being sold to a large private, or a public, company. This is a “Yes” or “No” question.`,dimension:`Finance`,subarea:`Planning, Analysis & Reporting`,weight:8},{id:`finance-planning-analysis-and-reporting-are-the-company-s-financial-statements-prepared-in-accordance-with-gaap`,text:`Are the Company's financial statements prepared in accordance with GAAP?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Planning, Analysis & Reporting`,weight:8},{id:`finance-planning-analysis-and-reporting-are-financials-prepared-and-reviewed-each-month-p-and-l-b-s-cash-flow`,text:`Are financials prepared and reviewed each month (p&l, b/s, cash flow)?`,guidance:`Many companies only manage their financial performance by the amount of cash in the bank account at the end of the month and the only financial report that gets prepared is the annual tax return prepared by their outside CPA. Companies with best practice financial reporting understand the importance of monthly financial reporting and the insights they gain for improving future performance and decision making. Score a 5 here if the Company prepares full financial statements each month, including income statement, balance sheet, and cash flow statement, and has a loose but consistent process of reviewing such financial reports in a timely manner following the end of each month. Score above a 5 to the extent the Company has a more formalized reporting schedule and review process, including deeper analytics regarding the underlying factors that drove the results, and includes the management team in the review process so that everybody remains aligned in how to move the Company forward. Score below a 5 to the extent the Company does not prepare full monthly financial statements and/or only has a haphazard process, if any, of reviewing the results with the management team.`,dimension:`Finance`,subarea:`Planning, Analysis & Reporting`,weight:8},{id:`finance-planning-analysis-and-reporting-does-the-company-prepare-annual-financial-projections`,text:`Does the Company prepare annual financial projections?`,guidance:`Many companies prepare a budgeted income statement for the following year, but neglect to prepare the projected balance sheet and cash flow statement that will result from the income statement. In doing so, they fail to realize that companies that are technically profitable from an income statement perspective are often financially distressed because the business is consuming cash flow quicker than it generates profits. Many companies in such situations have become distressed as a result. If full annual projections are prepared, companies will have greater visibility of potential cash flow challenges and be able to correct them before they materialize. Score a 5 here if the Company has a loose process for preparing annual financial projections that include some assessment of balance sheet and cash flow associated with the income statement. Score above a 5 to the extent the Company has a more formalized process of preparing full financial projections on at least a rolling quarterly basis and tracks and reports against such projections on a monthly basis. Score below a 5 to the extent the Company only prepares an annual projected income statement, or nothing at all, and...`,dimension:`Finance`,subarea:`Planning, Analysis & Reporting`,weight:8},{id:`finance-planning-analysis-and-reporting-are-the-projections-prepared-with-input-from-senior-management-team`,text:`Are the projections prepared with input from Senior Management Team?`,guidance:`The score for this question should not be higher than the score for question 1 but could be lower. If the Company has only developed a strategic plan at the level of a 3, for example, it should not score itself a 9 for senior management team input.`,dimension:`Finance`,subarea:`Planning, Analysis & Reporting`,weight:8},{id:`finance-planning-analysis-and-reporting-are-the-projections-reviewed-and-updated-at-least-quarterly`,text:`Are the projections reviewed and updated at least quarterly?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Planning, Analysis & Reporting`,weight:8},{id:`finance-planning-analysis-and-reporting-are-the-projections-supported-by-written-assumptions`,text:`Are the Projections supported by written assumptions?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Planning, Analysis & Reporting`,weight:8},{id:`finance-planning-analysis-and-reporting-do-projections-include-amounts-timing-and-type-of-any-new-capital-needed`,text:`Do projections include amounts, timing, and type of any new capital needed?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Planning, Analysis & Reporting`,weight:8},{id:`finance-planning-analysis-and-reporting-are-product-service-and-customer-profitability-regularly-analyzed`,text:`Are product/service and customer profitability regularly analyzed?`,guidance:`Many companies do not have the granular understanding of where they are making or losing profit and, therefore, cannot effectively make the best decisions regarding future growth and direction, product pricing, etc. Score a 5 here if the Company has at least a loose process for analyzing product line, SKU, and customer profitability on at least an annual basis. Score above a 5 to the extent the Company has a more formalized process for analyzing, reporting, and managing product line, SKU, and customer profitability on a more frequent basis than annually. Score below a 5 to the extent the Company only has a haphazard process, or none at all, of analyzing profitability on a more granular basis than merely overall for the company.`,dimension:`Finance`,subarea:`Planning, Analysis & Reporting`,weight:8},{id:`finance-planning-analysis-and-reporting-does-company-benchmark-performance-metrics-against-the-industry`,text:`Does Company benchmark performance metrics against the industry?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Planning, Analysis & Reporting`,weight:8},{id:`finance-financial-sustainability-describe-the-company-s-trend-in-gross-margin-over-the-last-12-months`,text:`Describe the Company's trend in gross margin % over the last 12 months`,guidance:`Score a 5 here if the Company’s profitability (net income) over the last 12 months has been flat with the prior 12 months in terms of absolute dollars. Increase or decrease the score by one point for each 10% increase or decrease in profitability in the last 12 months versus the prior 12 months.`,dimension:`Finance`,subarea:`Financial Sustainability`,weight:6},{id:`finance-financial-sustainability-describe-the-company-s-trend-in-profitability-over-the-last-12-months`,text:`Describe the Company's trend in profitability over the last 12 months.`,guidance:`Score a 5 here if the Company’s profitability (net income) over the last 12 months has been flat with the prior 12 months in terms of absolute dollars. Increase or decrease the score by one point for each 10% increase or decrease in profitability in the last 12 months versus the prior 12 months.`,dimension:`Finance`,subarea:`Financial Sustainability`,weight:6},{id:`finance-financial-sustainability-does-the-company-generate-enough-cash-to-meet-obligations-in-the-normal`,text:`Does the Company generate enough cash to meet obligations in the normal course?`,guidance:`Score a 5 here if the Company generates just enough cash to meet its obligations (operating costs, plus debt service, plus taxes, etc.) in the normal course. Increase or decrease the score by one point for each 5% of excess or shortfall of cash flow above or below the Company’s total obligations. Does the Company maintain weekly cash flow forecasts? One of the most valuable and least utilized financial tools for companies is the rolling 13-week cash flow projection. It provides tremendous financial visibility and ability to manage cash flow in many situations of growth, capital intensiveness, decline, or special situations, and should be a standard process and best practice for most companies. Score a 5 here if the Company has at least a loose process for maintaining weekly cash flow forecasts. Score above a 5 to the extent the Company has a more formalized process for projecting and managing cash flow on a weekly basis. Score below a 5 to the extent the Company has only a haphazard process, or none at all, of projecting cash flow on a weekly basis.`,dimension:`Finance`,subarea:`Financial Sustainability`,weight:8},{id:`finance-financial-sustainability-does-the-company-maintain-cash-flow-forecasts-at-least-monthly`,text:`Does the Company maintain cash flow forecasts at least monthly?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Financial Sustainability`,weight:8},{id:`finance-financial-sustainability-are-the-cash-flow-forecasts-used-to-manage-the-company-s-financial-affai`,text:`Are the cash flow forecasts used to manage the Company's financial affairs?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Financial Sustainability`,weight:8},{id:`finance-financial-sustainability-is-the-company-past-due-on-creditor-or-supplier-payments`,text:`Is the Company past due on creditor or supplier payments?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Financial Sustainability`,weight:8},{id:`finance-financial-sustainability-have-debt-covenant-defaults-occurred-or-are-any-expected-to-occur`,text:`Have debt covenant defaults occurred or are any expected to occur?`,guidance:`Many companies slip into debt covenant defaults with their lenders without being aware until the end of year reporting, resulting in strained lender relationships, costly waivers, more expensive debt, and more difficult measures to rectify the underlying problems. Technical covenant defaults (performance thresholds and ratios, etc.) can typically be avoided completely if monitored on a regular basis and can be addressed efficiently and relatively painlessly if identified to lenders immediately. Payment defaults are obviously a much more serious infraction. Score a 5 here if the Company expects that it might violate a minor technical covenant but is monitoring them closely and keeping its lender appraised. Score above a 5 to the extent it is unlikely that the Company will violate any technical debt covenants at all. Score below a 5 to the extent it is increasingly likely the Company will violate multiple technical covenants and/or incur a payment default.`,dimension:`Finance`,subarea:`Financial Sustainability`,weight:8},{id:`finance-financial-sustainability-describe-the-company-s-relationship-with-its-lender`,text:`Describe the Company's relationship with its lender.`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Financial Sustainability`,weight:6},{id:`finance-financial-sustainability-is-the-company-in-need-of-new-debt-or-equity-financing-in-the-next-12-mo`,text:`Is the Company in need of new debt or equity financing in the next 12 months?`,guidance:`Score a 5 here if the Company expects to need new debt financing for the purchase of equipment or other capital expenditures. Score above a 5 to the extent it is less likely that the Company will need any outside financing in the next 12 months. Score below a 5 to the extent it is more likely that the Company will need new equity or debt financing just for the survival of its ongoing operations.`,dimension:`Finance`,subarea:`Financial Sustainability`,weight:8},{id:`finance-financial-sustainability-does-the-company-have-adequate-cash-reserves-to-withstand-a-shock-to-bus`,text:`Does the Company have adequate cash reserves to withstand a shock to business?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Financial Sustainability`,weight:8},{id:`finance-financial-sustainability-does-the-company-have-access-to-more-equity-from-its-owners-if-needed`,text:`Does the Company have access to more equity from its owners, if needed?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Financial Sustainability`,weight:8},{id:`finance-financial-sustainability-are-there-any-expected-losses-that-have-not-already-been-recognized`,text:`Are there any expected losses that have not already been recognized?`,guidance:`Score a 5 here if the Company may be expecting some minor losses due to one-time events or temporary downturns in revenue or profitability but the losses will have minimal impact on its financial condition and sustainability. Score above a 5 to the extent it is less likely that the Company will experience any losses in the foreseeable future that have not already been recognized and recorded. Score below a 5 to the extent it is more likely the Company will incur major losses due to longer-term business trends or more significant one-time events that could have a serious impact on the Company’s financial condition and sustainability. Are raw material inventory purchases managed on a just-in-time basis? Many companies carry more inventory than necessary and do not effectively manage receivables. As a result, they often struggle to manage payables and need larger lines of credit to support overall working capital. In addition to being a costly and inefficient way to manage working capital, it can also cause problems when it comes time to sell the company, as prospective buyers will view historical working capital levels as being necessary, thereby reducing the potential...`,dimension:`Finance`,subarea:`Financial Sustainability`,weight:8},{id:`finance-financial-sustainability-are-there-any-contingent-liabilities-that-could-threaten-the-company-s-f`,text:`Are there any contingent liabilities that could threaten the Company's future?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Financial Sustainability`,weight:8},{id:`finance-financial-sustainability-if-yes-what-is-estimated-liability-in-thousands`,text:`If "yes", what is estimated liability (in thousands)?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Financial Sustainability`,weight:8},{id:`finance-balance-sheet-are-more-than-10-of-receivables-60-days-past-due`,text:`Are more than 10 % of receivables > 60 days past due?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Balance Sheet`,weight:8},{id:`finance-balance-sheet-if-applicable-is-inventory-actively-managed-to-optimize-amounts-and-obso`,text:`If applicable, is inventory actively managed to optimize amounts and obsolescence?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Balance Sheet`,weight:8},{id:`finance-balance-sheet-are-more-than-10-of-trade-payables-60-days-past-due`,text:`Are more than 10% of trade payables > 60 days past due?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Balance Sheet`,weight:8},{id:`finance-balance-sheet-does-the-company-have-an-adequate-working-capital-line-of-credit`,text:`Does the Company have an adequate working capital line of credit?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Balance Sheet`,weight:8},{id:`finance-balance-sheet-are-there-any-unfunded-or-underfunded-pension-or-benefit-plan-liabilitie`,text:`Are there any unfunded or underfunded pension or benefit plan liabilities?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Balance Sheet`,weight:8},{id:`finance-balance-sheet-are-there-any-balance-sheet-assets-not-used-in-business`,text:`Are there any balance sheet assets not used in business?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Balance Sheet`,weight:8},{id:`finance-internal-controls-does-the-company-comply-with-sarbanes-oxley`,text:`Does the Company comply with Sarbanes-Oxley?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Internal Controls`,weight:8},{id:`finance-internal-controls-does-the-company-have-written-internal-control-policies`,text:`Does the Company have written internal control policies?`,guidance:`Internal controls include such topics as segregation of duties within the financial functions, levels of authorization for different managers and executives throughout the company to approve and execute transactions, and security around access to sensitive files and systems, among others. Companies with weak or no internal controls are much more prone to unauthorized and potentially damaging activity. Score a 5 here if the Company has at least some written formal internal control policies and they are current and enforced. Score above a 5 to the extent the Company has a more formal process around developing and monitoring internal control policies and involves outside independent experts (CPA, systems experts, boards of advisors, etc.) in the development of its internal control policies. Score below a 5 to the extent the Company has unwritten internal control policies or no such policies at all, and/or does not monitor them or keep them current.`,dimension:`Finance`,subarea:`Internal Controls`,weight:8},{id:`finance-internal-controls-have-the-policies-been-reviewed-updated-in-the-last-year`,text:`Have the policies been reviewed / updated in the last year?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Internal Controls`,weight:8},{id:`finance-internal-controls-have-the-policies-been-reviewed-by-an-outside-cpa-firm`,text:`Have the policies been reviewed by an outside CPA firm?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Internal Controls`,weight:8},{id:`finance-internal-controls-are-the-policies-enforced-consistently`,text:`Are the policies enforced consistently?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Internal Controls`,weight:8},{id:`finance-information-systems-are-technology-systems-in-place-to-support-all-business-functions`,text:`Are technology systems in place to support all business functions?`,guidance:`Does the Company have an ERP system?`,dimension:`Finance`,subarea:`Information Systems`,weight:8},{id:`finance-information-systems-describe-the-company-s-accounting-and-costing-systems`,text:`Describe the Company's accounting and costing systems.`,guidance:`Factors to consider in assessing the Company’s accounting systems include the following, as examples:`,dimension:`Finance`,subarea:`Information Systems`,weight:6},{id:`finance-information-systems-do-systems-maximize-the-leveraging-of-people`,text:`Do systems maximize the leveraging of people?`,guidance:`Score a 5 here if the Company’s systems are adequate in fulfilling the above needs but have much room for improvement and updating. Score above a 5 to the extent the systems are more state-of-the-art in fulfilling the above needs. Score below a 5 to the extent the systems fall short of fulfilling the above needs.`,dimension:`Finance`,subarea:`Information Systems`,weight:8},{id:`finance-information-systems-do-systems-minimize-the-redundancy-of-data-entry`,text:`Do systems minimize the redundancy of data entry?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Information Systems`,weight:8},{id:`finance-information-systems-do-people-have-easy-access-to-information-to-do-their-jobs`,text:`Do people have easy access to information to do their jobs?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Information Systems`,weight:8},{id:`finance-information-systems-do-systems-produce-usable-information-that-is-reliable-and-of-high-quali`,text:`Do systems produce usable information that is reliable and of high quality?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Information Systems`,weight:8},{id:`finance-information-systems-do-systems-produce-the-information-necessary-to-effectively-manage`,text:`Do systems produce the information necessary to effectively manage?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Information Systems`,weight:8},{id:`finance-information-systems-would-new-systems-be-required-to-manage-projected-growth`,text:`Would new systems be required to manage projected growth?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Information Systems`,weight:8},{id:`finance-information-systems-if-yes-has-cost-been-included-in-financial-projections`,text:`If "yes", has cost been included in financial projections?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Information Systems`,weight:8},{id:`finance-risk-management-does-the-company-have-a-full-business-insurance-package-in-force`,text:`Does the Company have a full business insurance package in-force?`,guidance:`A full business package would include property, general liability, umbrella, and worker’s compensation, at a minimum.`,dimension:`Finance`,subarea:`Risk Management`,weight:8},{id:`finance-risk-management-are-all-insurance-policies-reviewed-by-an-insurance-agent-annually`,text:`Are all insurance policies reviewed by an insurance agent annually?`,guidance:`As companies evolve and grow, their insurance coverages should be reviewed and updated at least annually or whenever major changes to its business occur.`,dimension:`Finance`,subarea:`Risk Management`,weight:8},{id:`finance-risk-management-does-the-company-have-officers-and-directors-liability-insurance`,text:`Does the Company have Officers & Directors liability insurance?`,guidance:`D&O insurance can be somewhat difficult to obtain and can be somewhat expensive but can also provide critical protection against lawsuits that attempt to pierce the corporate veil and attack executives directly. Does the Company back-up its computer systems regularly? This is a constantly evolving risk to companies and should be reviewed by outside systems experts at least on a quarterly basis, or whenever major changes to the business or systems occur, in order to properly protect the Company.`,dimension:`Finance`,subarea:`Risk Management`,weight:8},{id:`finance-risk-management-what-of-business-is-conducted-in-foreign-currencies`,text:`What % of business is conducted in foreign currencies?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Risk Management`,weight:8},{id:`finance-risk-management-have-adequate-measures-been-taken-to-mitigate-any-foreign-currency-risk`,text:`Have adequate measures been taken to mitigate any foreign currency risk?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Risk Management`,weight:8},{id:`finance-risk-management-is-the-company-compliant-with-all-information-privacy-and-security-stand`,text:`Is the Company compliant with all information privacy and security standards, laws, and customer contracts?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Risk Management`,weight:8},{id:`finance-risk-management-does-the-company-have-data-protection-backup-and-recovery-processes-in-p`,text:`Does the Company have data protection, backup, and recovery processes in place?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Risk Management`,weight:8},{id:`finance-risk-management-are-back-ups-stored-off-site`,text:`Are back-ups stored off-site?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Risk Management`,weight:8},{id:`finance-risk-management-are-key-files-stored-in-fire-retardant-cabinets`,text:`Are key files stored in fire-retardant cabinets?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Risk Management`,weight:8},{id:`finance-risk-management-is-the-company-server-protected-from-unauthorized-access-and-electronic`,text:`Is the Company server protected from unauthorized access and electronic intrusion?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Finance`,subarea:`Risk Management`,weight:8}]},{id:`legal`,name:`Legal`,icon:De,subareas:[`Litigation`,`Intellectual Property`,`Contracts & Agreements`,`Filings, Licenses Disclosures`],questions:[{id:`legal-litigation-have-any-of-the-owners-ever-been-convicted-of-a-felony`,text:`Have any of the owners ever been convicted of a felony?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Legal`,subarea:`Litigation`,weight:8},{id:`legal-litigation-if-yes-was-the-convicted-owner-the-controlling-owner`,text:`If "yes", was the convicted owner the controlling owner?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Legal`,subarea:`Litigation`,weight:8},{id:`legal-litigation-is-there-any-threatened-or-pending-litigation-against-the-company`,text:`Is there any threatened or pending litigation against the Company?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Legal`,subarea:`Litigation`,weight:8},{id:`legal-litigation-could-a-negative-outcome-threaten-the-company-s-viability`,text:`Could a negative outcome threaten the Company's viability?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Legal`,subarea:`Litigation`,weight:8},{id:`legal-litigation-has-the-company-ever-been-successfully-prosecuted-in-the-past`,text:`Has the Company ever been successfully prosecuted in the past?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Legal`,subarea:`Litigation`,weight:8},{id:`legal-intellectual-property-does-the-company-own-any-intellectual-property`,text:`Does the Company own any intellectual property?`,guidance:`Intellectual property includes not only patents, but also trade secrets, proprietary processes, tradenames and trademarks, logos, websites and domain names, published content, and customer lists, among others. Virtually every company owns some intellectual property.`,dimension:`Legal`,subarea:`Intellectual Property`,weight:8},{id:`legal-intellectual-property-is-it-being-actively-used-in-the-current-business`,text:`Is it being actively used in the current business?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Legal`,subarea:`Intellectual Property`,weight:8},{id:`legal-intellectual-property-has-it-been-legally-protected`,text:`Has it been legally protected?`,guidance:`Legal protection can take many forms, including patents, copyrights, registrations, non-disclosure agreements, employment agreements, buy-sell agreements, and operating agreements, as examples. Contracts and Agreements Are all corporate contracts reviewed by a qualified person? A qualified person would primarily include an attorney but, in routine or repetitive contracts, could also include somebody who is very experienced in reviewing contracts and was not the same person who drafted the contract or participated in the original negotiation. Filings, Licenses, and Disclosures`,di
