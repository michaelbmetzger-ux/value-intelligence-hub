ively and not moving the company forward in an aligned and disciplined manner. A fully developed strategic plan would include overarching concepts such as mission, vision, values, SWOT, long-term (3-5 year) objectives, strategic frameworks, and THEN tactical plans developed to achieve the bigger plan. On a scale of 1-10, tactical plans by themselves, even if fully developed and written, would earn a score of only 3 or 4, or maybe less if all functional departments have not participated. Only a fully developed and documented strategic plan with all the above components would earn a high score. Score a 5 here if the Company has some written components of a strategic plan beyond a one-year tactical operating plan and budget and has a loose process for...`,dimension:`Planning`,subarea:`Business Planning`,weight:8},{id:`planning-business-planning-was-the-plan-developed-with-input-from-the-senior-management-team`,text:`Was the plan developed with input from the senior management team?`,guidance:`The score for this question should not be higher than the score for question 1 but could be lower. If the Company has only developed a strategic plan at the level of a 3, for example, it should not score itself a 9 for senior management team input.`,dimension:`Planning`,subarea:`Business Planning`,weight:8},{id:`planning-business-planning-has-the-plan-been-updated-within-the-last-12-months`,text:`Has the plan been updated within the last 12 months?`,guidance:`The score for this question should not be higher than the score for question 1 but could be lower. If the Company has only developed a strategic plan at the level of a 3, for example, it should not score itself a 9 for having updated the plan.`,dimension:`Planning`,subarea:`Business Planning`,weight:8},{id:`planning-business-planning-has-the-plan-been-reviewed-by-an-outside-board-or-advisor`,text:`Has the plan been reviewed by an outside board or advisor?`,guidance:`The score for this question should not be higher than the score for question 1 but could be lower. If the Company has only developed a strategic plan at the level of a 3, for example, it should not score itself a 9 for having the plan reviewed by an independent board or advisor.`,dimension:`Planning`,subarea:`Business Planning`,weight:8},{id:`planning-business-planning-is-the-plan-being-actively-used-to-guide-business-activities-and-decisio`,text:`Is the plan being actively used to guide business activities and decisions?`,guidance:`The score for this question should not be higher than the score for question 1 but could be lower. If the Company has only developed a strategic plan at the level of a 3, for example, it should not score itself a 9 for using the plan to guide business decisions.`,dimension:`Planning`,subarea:`Business Planning`,weight:8},{id:`planning-target-market-how-well-established-is-the-market-for-the-company-s-products-services`,text:`How well established is the market for the Company's products/services?`,guidance:`If the Company’s target market for its products has existed for many years, is stable and growing, and easily large enough for the Company to reach its long-term growth objectives without expanding into new markets, it would rate a high score, in the range of 8-10. If the Company is introducing a brand-new product that is totally unfamiliar to its target market and needs to educate and create its own new market demand, it would rate a low score in the range of 0 – 3. If the Company’s target market reflects an emerging industry that hasn’t existed for many years but has existed for long enough to be a proven viable long-term market, score between a 4 - 7.`,dimension:`Planning`,subarea:`Target Market`,weight:8},{id:`planning-target-market-describe-the-geographic-range-of-the-company-s-target-market`,text:`Describe the geographic range of the Company's target market.`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Planning`,subarea:`Target Market`,weight:6},{id:`planning-target-market-what-is-the-long-term-growth-outlook-for-the-company-s-target-market`,text:`What is the long-term growth outlook for the Company's target market?`,guidance:`This question is intended to address the outlook for target market demand for the company’s products over the next 3-5 years. It does not necessarily mean the Company’s sales will grow or shrink at the same rate. It only addresses the market demand for the types of products the Company sells. The percentages below represent expected annual rates of growth or decline. Score a 0 if the expected annual reduction is > 20%. Score a 1 if the expected annual reduction is 16%-20%. Score a 2 if the expected annual reduction is 11%-15%. Score a 3 if the expected annual reduction is 6%-10%. Score a 4 if the expected annual reduction is 1%-5%. Score a 5 if the outlook for the target market demand is relatively flat. Score a 6 if the expected annual growth is 1%-5%. Score a 7 if the expected annual growth is 6%-10%. Score an 8 if the expected annual growth is 11%-15%. Score a 9 if the expected annual growth is 16%-20%. Score a 10 if the expected annual growth is > 20%`,dimension:`Planning`,subarea:`Target Market`,weight:8},{id:`planning-competition-describe-the-company-s-position-within-its-target-market`,text:`Describe the Company's position within its target market.`,guidance:`Score a 5 if the Company has a sustainable market share enough to be profitable but its market share is neither growing nor shrinking. Score above a 5 to the extent the Company’s market share is sustainable and profitable and steadily growing towards being the dominant competitor in its market. Score below a 5 to the extent the Company has some market share but not enough to be a sustainable or profitable competitor and maybe losing market share, or may be only entering or creating the market for its products.`,dimension:`Planning`,subarea:`Competition`,weight:6},{id:`planning-competition-how-would-you-rate-the-company-s-direct-competition`,text:`How would you rate the Company's direct competition?`,guidance:`Score a 5 if the Company’s strongest direct competitors are evenly matched with the Company. Score above a 5 to the extent the Company’s strongest direct competitors are weaker and not much of a factor, or the Company has no direct competitors. Score below a 5 to the extent the Company’s strongest direct competitors are more than evenly matched with the Company and potentially getting stronger, larger, and better capitalized.`,dimension:`Planning`,subarea:`Competition`,weight:8},{id:`planning-competition-how-would-you-rate-the-company-s-competition-from-substitute-products-se`,text:`How would you rate the Company's competition from substitute products/services?`,guidance:`In this context, “substitute products” means a potentially disruptive different solution than the type of solution that the Company’s products provide for the same market need. For example, wireless technology replacing wired circuitry, plastic composites replacing metal components, or solar panels replacing fossil fuel energy. Score a 5 if the Company’s strongest substitute product competitor is evenly matched with the Company. Score above a 5 to the extent the Company’s strongest substitute product competitor is weaker and not much of a factor, or the Company has no substitute product competitors. Score below a 5 to the extent the Company’s strongest substitute product competitor is more than evenly matched with the Company and potentially getting stronger, larger, and better capitalized.`,dimension:`Planning`,subarea:`Competition`,weight:8},{id:`planning-competition-describe-the-effect-of-market-price-pressures-on-gross-margins`,text:`Describe the effect of market price pressures on gross margins.`,guidance:`Score a 5 if the Company has some market pressures but is still able to remain profitable given the price constraints it faces. Score above a 5 to the extent the Company faces slight or no market price pressures and any such pressures are not enough to have much impact on its operations or profitability. Score below a 5 to the extent the Company is facing increasing to severe market price pressures and it is becoming a more serious issue to be solved. Barriers to Entry`,dimension:`Planning`,subarea:`Competition`,weight:6},{id:`planning-barriers-to-entry-rate-the-technological-barriers-to-new-market-entrants-in-the-company-s`,text:`Rate the Technological barriers to new market entrants in the Company's industry.`,guidance:`If a company of similar size to your company, or similar in size to any of your direct competitors, wanted to enter your industry, how much of a barrier would each of these factors present to that new entrant becoming a competitive threat? Technology might include proprietary systems and processes, secret or patented formulas or designs, specialized equipment not available to others, protected intellectual knowledge, and similar assets.`,dimension:`Planning`,subarea:`Barriers To Entry`,weight:6},{id:`planning-barriers-to-entry-rate-the-capital-intensity-barriers-to-new-market-entrants-in-the-compan`,text:`Rate the Capital Intensity barriers to new market entrants in the Company's industry.`,guidance:`If a company of similar size to your company, or similar in size to any of your direct competitors, wanted to enter your industry, how much of a barrier would each of these factors present to that new entrant becoming a competitive threat? Capital intensiveness would consider the investment needed in equipment, facilities, systems, people, inventory, R&D, etc., for a new entrant to become a competitive threat. If it is likely that a large company already has excess capacity in some or all of these categories and would only need to repurpose its assets, the barriers would be relatively low. However, if it is unlikely that an existing large company would enter your market, then consider a company of similar or smaller size entering your market and having to invest in all the necessary assets.`,dimension:`Planning`,subarea:`Barriers To Entry`,weight:6},{id:`planning-barriers-to-entry-rate-the-reputational-barriers-to-new-market-entrants-in-the-company-s-i`,text:`Rate the Reputational barriers to new market entrants in the Company's industry.`,guidance:`If a company of similar size to your company, or similar in size to any of your direct competitors, wanted to enter your industry, how much of a barrier would each of these factors present to that new entrant becoming a competitive threat? Reputation relates to how hard it would be for a new entrant to gain enough trust of the market to become a competitive threat. If your company has a strong reputation in product quality, or service, or on-time delivery, or similar attributes that are considered critical by your customer base, the reputational barrier might be high. If it is likely that a large company might enter your market space with an already established strong market reputation, then the barrier here might be low. However, if it is unlikely that an existing large company would enter your market, then consider a company entering your market with no established reputation.`,dimension:`Planning`,subarea:`Barriers To Entry`,weight:6},{id:`planning-barriers-to-entry-rate-the-regulatory-barriers-to-new-market-entrants-in-the-company-s-ind`,text:`Rate the Regulatory barriers to new market entrants in the Company's industry.`,guidance:`If a company of similar size to your company, or similar in size to any of your direct competitors, wanted to enter your industry, how much of a barrier would each of these factors present to that new entrant becoming a competitive threat? Regulatory relates to licensing, permitting, and compliance factors that would be required for a new entrant to overcome if they want to challenge your market position. If it is likely that a large company with regulatory expertise might enter your market space, then the barrier here might be low. However, if it is unlikely that an existing large company would enter your market, then consider a company entering your market with no such experience.`,dimension:`Planning`,subarea:`Barriers To Entry`,weight:6},{id:`planning-barriers-to-entry-rate-any-other-barriers-to-new-market-entrants-in-the-company-s-industry`,text:`Rate any Other barriers to new market entrants in the Company's industry.`,guidance:`If a company of similar size to your company, or similar in size to any of your direct competitors, wanted to enter your industry, how much of a barrier would each of these factors present to that new entrant becoming a competitive threat? Other barriers might include the ability to attract the necessary skilled or professional labor, the length of time to develop a competitive product, or an exclusive supply chain for key materials, as examples. Product and Market Development Is the Company's industry prone to frequent product evolution? The higher the rate of product evolution, the greater the risk that the Company’s product(s) could be leap-frogged in the market and cause a setback in the Company’s growth and profitability. Score a 5 here if product evolution occasionally occurs, and sometimes requires a competitive response in the form of product enhancements by the Company, and sometimes results in temporary setbacks in the Company’s growth and profitability until it catches up to the market. Score above a 5 to the extent product evolution requiring a competitive response is infrequent, or never, and would not cause a setback in the Company’s future. Score below a 5...`,dimension:`Planning`,subarea:`Barriers To Entry`,weight:6},{id:`planning-product-and-market-development-is-the-company-s-industry-prone-to-technological-changes`,text:`Is the Company's industry prone to technological changes?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Planning`,subarea:`Product & Market Development`,weight:8},{id:`planning-product-and-market-development-will-the-company-need-to-reinvent-its-products-services-to-remain-compet`,text:`Will the Company need to reinvent its products/services to remain competitive?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Planning`,subarea:`Product & Market Development`,weight:8},{id:`planning-product-and-market-development-will-the-company-need-to-develop-new-markets-to-remain-competitive`,text:`Will the Company need to develop new markets to remain competitive?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Planning`,subarea:`Product & Market Development`,weight:8}]},{id:`leadership`,name:`Leadership`,icon:Oe,subareas:[`Board of Advisors`,`Senior Management Team`,`Leadership Communication`,`Corporate Culture`,`Succession Planning`],questions:[{id:`leadership-board-of-advisors-does-the-company-have-an-independent-board-of-directors-or-advisors`,text:`Does the Company have an independent Board of Directors or Advisors?`,guidance:`A board of advisors would typically mean at least 3 outside advisors who are not related to the owner/CEO and have knowledge/expertise or skill sets that are different from the owner/CEO.`,dimension:`Leadership`,subarea:`Board of Advisors`,weight:8},{id:`leadership-board-of-advisors-does-the-board-meet-at-least-quarterly`,text:`Does the Board meet at least quarterly?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Leadership`,subarea:`Board of Advisors`,weight:8},{id:`leadership-board-of-advisors-how-active-and-collaborative-is-the-board-with-management`,text:`How active and collaborative is the Board with Management?`,guidance:`The most effective advisory boards provide guidance and mentorship to the management team as well as being a resource to the CEO for strategy development, decision making, market introductions, etc. Score a 5 if the advisory board interacts with members of the management team at each board meeting and the members of the management team make periodic board presentations about their departmental objectives and progress. Score above a 5 to the extent the advisory board has more direct involvement and communication with management in between board meetings and actively provides guidance and mentorship. Score below a 5 to the extent the advisory board has little to no direct communication with management and only hears about their activities from the CEO. How diverse are the Board members in their respective skill sets? The most effective boards of advisors bring balance to the CEO by offering expertise in all areas where the CEO is not an expert. The more functional categories that the board can represent, the more effective will be the guidance they can offer to the CEO. Enter a score based on 2-times the number of different functional areas represented on the advisory...`,dimension:`Leadership`,subarea:`Board of Advisors`,weight:8},{id:`leadership-board-of-advisors-how-diverse-are-the-board-members-in-their-respective-skills-experience`,text:`How diverse are the Board members in their respective skills, experience, and market relationships?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Leadership`,subarea:`Board of Advisors`,weight:8},{id:`leadership-board-of-advisors-how-much-influence-does-the-board-have-over-major-decisions`,text:`How much influence does the Board have over major decisions?`,guidance:`The most effective boards are boards of directors, rather than boards of advisors. The difference is in the level of authority of the board. Public company boards of directors have approval/veto rights over major decisions of the company such as mergers, acquisitions, major strategic shifts, executive level hiring and firing, etc., and also have oversight authority over the CEO and management team to ensure that all necessary qualitative attributes of the company are fully developed and functioning to move the company toward its overall objectives. Score a 5 here if the advisory board has meaningful influence but not authority over major decisions of the CEO. Score above a 5 to the extent the advisory board functions closer to a board of directors with veto authority over major decisions. Score below a 5 to the extent the advisory board is closer to a figure head board with little to no influence into the decisions of the CEO.`,dimension:`Leadership`,subarea:`Board of Advisors`,weight:8},{id:`leadership-senior-management-team-is-there-a-formal-senior-management-team-recognized-by-employees`,text:`Is there a formal Senior Management Team recognized by employees?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Leadership`,subarea:`Senior Management Team`,weight:8},{id:`leadership-senior-management-team-does-the-senior-management-team-meet-at-least-monthly`,text:`Does the Senior Management Team meet at least monthly?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Leadership`,subarea:`Senior Management Team`,weight:8},{id:`leadership-senior-management-team-does-the-team-include-members-from-all-functional-disciplines`,text:`Does the Team include members from all functional disciplines?`,guidance:`If one member of the team is running multiple functions within the Company, then none of those functions are adequately being represented. Consider this in the context of the existing management team running the Company when it is 2 – 3 times the current size. Would all functional disciplines be adequately represented by the existing team? It is not suggesting that the team necessarily be expanded now, since the current size might not warrant that. However, this is a “best practice” standard and is not conditional on the size, but rather may be something to move towards in the future. Score this as a Yes or a No.`,dimension:`Leadership`,subarea:`Senior Management Team`,weight:8},{id:`leadership-senior-management-team-what-is-the-average-educational-level-of-the-senior-management-team`,text:`What is the average educational level of the Senior Management Team?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Leadership`,subarea:`Senior Management Team`,weight:8},{id:`leadership-senior-management-team-what-is-the-team-s-average-experience-running-companies-in-this-industry`,text:`What is the Team's average experience running companies in this industry?`,guidance:`This question is assessing whether additional training or resources might be needed to enhance the management team’s ability to meet the challenges of growing the Company in this industry.`,dimension:`Leadership`,subarea:`Senior Management Team`,weight:8},{id:`leadership-senior-management-team-what-is-the-team-s-average-experience-running-companies-at-this-stage`,text:`What is the Team's average experience running companies at this stage?`,guidance:`Different stages of companies (rapid growth, steady-state, decline, acquisition integration, exit planning) can present very different challenges. This question is assessing whether additional training or resources might be needed to enhance the management team’s ability to meet the challenges of the Company’s current stage.`,dimension:`Leadership`,subarea:`Senior Management Team`,weight:8},{id:`leadership-leadership-communication-does-the-company-have-clearly-written-mission-and-vision-statements`,text:`Does the Company have clearly written mission and vision statements?`,guidance:`Most companies do not have clear mission and vision statements and, even those that do have them, often have ineffective statements because they do not understand the differences between mission and vision or how to properly craft them in a way the will align and motivate their entire workforce. Mission and Vision statements are not academic exercises to be taken lightly. They are, rather, the cornerstones on which the rest of the company will be built.`,dimension:`Leadership`,subarea:`Leadership Communication`,weight:8},{id:`leadership-leadership-communication-have-short-and-long-term-goals-been-developed-and-written`,text:`Have short and long-term goals been developed and written?`,guidance:`Short-term goals might only have a one-year outlook but should not be limited to only financial goals. Workforces need other goals besides revenue and profit to fully buy-in to the company’s plans and be dedicated. Long-term goals can only be effectively developed after development of the mission and vision statements because mission and vision represent the first layer of the filter system that strategic planning establishes. So, any long-term goal must pass through the mission/vision filter before being adopted by the company. Score a 5 here if either short-term or long-term goals have been developed (but not both) and whichever has been developed has passed through the filter of mission and vision statements. Score above a 5 to the extent that both short-term and long-term goals have been fully developed, written, and adopted after passing through the filter of well-developed mission and vision statements. Score below a 5 to the extent that short-term or long-term goals have either been established but need refinement and need to pass through the mission/vision filter before being adopted or have not been established at all.`,dimension:`Leadership`,subarea:`Leadership Communication`,weight:8},{id:`leadership-leadership-communication-have-the-mission-vision-and-goals-been-clearly-communicated-to-all-emplo`,text:`Have the mission, vision, and goals been clearly communicated to all employees?`,guidance:`The most effective communication occurs when it is reinforced at every opportunity, in written and verbal forms, by the CEO, and leadership team, and managers, and it is explained in different ways to convey the same message so that every employee fully understands the communication and believes that it is consistent and non-negotiable`,dimension:`Leadership`,subarea:`Leadership Communication`,weight:8},{id:`leadership-leadership-communication-are-written-tactical-plans-developed-around-goals`,text:`Are written tactical plans developed around goals?`,guidance:`Tactical plans typically represent a 12-month list of the most important steps that each functional department can take in order to help the Company achieve its short-term goals. Every functional department should maintain a rolling 12-month tactical plan and break it down within the department to shorter steps that the departmental employees can take in order to achieve the 12-month goals of the department. In this manner, all employees have an opportunity to understand their role in helping the Company succeed and they are more likely to buy-in and become more dedicated to their jobs. Score a 5 here if every functional department maintains a rolling tactical plan but the developed tactical plans are not tied to any overall goals of the Company. Score above a 5 to the extent that tactical plans are developed for every functional department and are aligned with each other and with the overall goals of the Company. Score below a 5 to the extent that only certain functional departments, or no departments, have begun to develop tactical plans and there is still a long way to go to refine them and/or tie them to overall Company goals.`,dimension:`Leadership`,subarea:`Leadership Communication`,weight:8},{id:`leadership-leadership-communication-are-tactical-plans-connected-to-business-plan-and-budgets`,text:`Are tactical plans connected to business plan and budgets?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Leadership`,subarea:`Leadership Communication`,weight:8},{id:`leadership-leadership-communication-is-company-performance-against-mission-vision-and-goals-communicated-wit`,text:`Is Company performance against mission, vision, and goals communicated with employees on a regular basis?`,guidance:`Communicating company performance does not necessarily mean announcing confidential information such as revenue or profitability but does mean communicating on a regular basis (i.e.: at least quarterly) as to how the Company is progressing toward its short-term and long-term goals and related tactical plans. Is it on schedule? Is it evolving? Are there roadblocks that need to be overcome? Etc. Score a 5 here if the CEO only updates the leadership team at least quarterly, but not the whole workforce. Score above a 5 to the extent that the CEO updates the whole workforce on a quarterly basis. Score below a 5 to the extent that the CEO only updates the leadership team and does so less than quarterly, if at all.`,dimension:`Leadership`,subarea:`Leadership Communication`,weight:8},{id:`leadership-corporate-culture-does-the-corporate-culture-foster-employee-creativity-and-initiative`,text:`Does the corporate culture foster employee creativity and initiative?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Leadership`,subarea:`Corporate Culture`,weight:8},{id:`leadership-corporate-culture-does-the-culture-foster-collaboration-among-departments-and-employees`,text:`Does the culture foster collaboration among departments and employees?`,guidance:`Does the corporate culture foster employee creativity and collaboration among departments? The most successful companies are able to tap into the creative energy of their workforces by finding ways to encourage and reward collaboration and creativity, while companies that do not reach their full potential often have cultures that effectively discourage their workforces from collaborating by not recognizing their efforts or, worse, by allowing politics and unhealthy competition to drive culture. Score a 5 here if the Company neither actively rewards nor actively discourages employees from collaboration and creativity but does have some loose process for creating a healthy culture or at least maintaining a neutral culture. Score above a 5 to the extent the Company has a more formalized process for encouraging employees and rewarding employee creativity and collaboration. Score below a 5 to the extent the Company often, and maybe unintentionally, discourages employee creativity and collaboration.`,dimension:`Leadership`,subarea:`Corporate Culture`,weight:8},{id:`leadership-corporate-culture-does-the-culture-actively-develop-future-leaders-throughout-the-company`,text:`Does the culture actively develop future leaders throughout the Company?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Leadership`,subarea:`Corporate Culture`,weight:8},{id:`leadership-corporate-culture-are-the-expectations-of-all-employees-clear-at-all-levels`,text:`Are the expectations of all employees clear at all levels?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Leadership`,subarea:`Corporate Culture`,weight:8},{id:`leadership-corporate-culture-are-all-employees-accountable-for-performance-against-clear-expectations`,text:`Are all employees accountable for performance against clear expectations and objectives?`,guidance:`People generally perform better in a structured and disciplined environment where expectations are clear, and they are accountable for achieving them. Score a 5 here if some expectations are clear and some accountability is developed and enforced, but there is a lot of room for improvement in one or both. Score above a 5 to the extent that expectations of all employees are clear, the employees have the resources they need to meet expectations, and they are regularly (weekly/ monthly/ quarterly) held accountable for their performance against such expectations. Score below a 5 to the extent there is only haphazard focus on developing expectations for all employees and/or developing a method to hold employees accountable for performance, or there has been no effort yet in this area.`,dimension:`Leadership`,subarea:`Corporate Culture`,weight:8},{id:`leadership-corporate-culture-does-the-culture-emphasize-continuous-improvements-and-efficiencies`,text:`Does the culture emphasize continuous improvements and efficiencies?`,guidance:`Score a 5 here if the Company has a Loose Process of emphasizing continuous improvements but in the Early Stages of Development with Significant Opportunity for Improvement. Score above a 5 to the extent there is a more formalized process with significant development and focus, moving toward being on par with best-in-class companies. Score below a 5 to the extent there is only haphazard management focus, if any, on continuous improvements and efficiencies.`,dimension:`Leadership`,subarea:`Corporate Culture`,weight:8},{id:`leadership-corporate-culture-is-the-culture-suited-to-capitalize-on-dynamic-growth-opportunities`,text:`Is the culture suited to capitalize on dynamic growth opportunities?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Leadership`,subarea:`Corporate Culture`,weight:8},{id:`leadership-succession-planning-is-there-a-written-succession-plan-in-place`,text:`Is there a written succession plan in-place?`,guidance:`In this context, succession relates to management and operating succession rather than ownership succession. The question addresses whether every critical position in the Company, whether executives, management, or line workers, has a backup person identified who could fill that role in the event the incumbent becomes incapable of fulfilling their responsibilities for any reason. The plan would include the person identified, whether they have been informed and adequately trained, what skills gaps exist and a plan to provide any necessary training or other resources to prepare the backup for the subject position.`,dimension:`Leadership`,subarea:`Succession Planning`,weight:8},{id:`leadership-succession-planning-has-the-plan-been-updated-within-the-last-year`,text:`Has the plan been updated within the last year?`,guidance:`The score here should not be higher than the score from the previous question but could be lower, since it needs to have a fully developed written policies manual in order to score highly in having updated it. If the Company has completely updated what amounts to only a partial polices manual, then score here the same as the previous question. If the Company has only partially updated what was already only a partial policies manual, score lower than the previous question.`,dimension:`Leadership`,subarea:`Succession Planning`,weight:8},{id:`leadership-succession-planning-does-the-plan-identify-the-next-leaders-and-define-their-development-pat`,text:`Does the plan identify the next leaders and define their development paths?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Leadership`,subarea:`Succession Planning`,weight:8},{id:`leadership-succession-planning-has-the-succession-plan-been-reviewed-by-an-outside-expert`,text:`Has the succession plan been reviewed by an outside expert?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Leadership`,subarea:`Succession Planning`,weight:8}]},{id:`sales`,name:`Sales`,icon:ce,subareas:[`Sales Reach`,`Sales Team`,`Sales Strategy`,`Sales Operations`,`Sales Projections`,`Customer Base`],questions:[{id:`sales-sales-reach-in-what-regions-does-the-company-sell-its-products-services`,text:`In what regions does the Company sell its products/services?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Sales`,subarea:`Sales Reach`,weight:8},{id:`sales-sales-team-does-the-company-have-a-dedicated-in-house-sales-executive`,text:`Does the Company have a dedicated in-house sales executive?`,guidance:`The key word here is “dedicated”, meaning the executive’s exclusive responsibility is managing the sales function for the Company. If the person who manages sales also manages marketing or another function, the answer here should be “No”. Remember that this is not a size dependent questionnaire, so it doesn’t necessarily mean the Company should have a “dedicated” sales executive at the Company’s current stage but, as the Company grows, it will likely need a dedicated sales leader at some point, which is a best practice standard.`,dimension:`Sales`,subarea:`Sales Team`,weight:8},{id:`sales-sales-team-is-there-a-dedicated-sales-team-in-addition-to-or-in-lieu-of-the-executi`,text:`Is there a dedicated sales team in addition to, or in lieu of, the executive?`,guidance:`If the Company’s sales leader also leads other functions, they would be considered part of the sales team rather than a “dedicated” sales executive. If the Company utilizes outside sales resources such as independent reps or other outsourced sales functions, they would also count as part of the sales team. Describe sales team's average experience selling the Company's products. Equate the score here to the average number of years of experience of the sales team. For example, if the average is 8 years, score an 8 here.`,dimension:`Sales`,subarea:`Sales Team`,weight:8},{id:`sales-sales-team-describe-sales-team-s-average-sales-experience-prior-to-joining-the-comp`,text:`Describe sales team's average sales experience prior to joining the Company.`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Sales`,subarea:`Sales Team`,weight:6},{id:`sales-sales-team-describe-the-sales-team-s-average-experience-selling-similar-products-se`,text:`Describe the sales team's average experience selling similar products/services outside the Company.`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Sales`,subarea:`Sales Team`,weight:6},{id:`sales-sales-strategy-does-the-company-have-a-written-sales-plan-and-market-strategy`,text:`Does the Company have a written sales plan and market strategy?`,guidance:`Many companies prepare one-year sales plans as part of their annual budgeting process. That activity is considered more tactical than strategic and would not meet the standard of a written sales plan and market strategy. A full sales plan and market strategy would include a 3-5-year outlook of where and how the Company wants to grow, supported by certain strategic frameworks such as the Ansoff Matrix, the Value Disciplines Model, and Bowman’s Strategy Clock. With the guidance of these frameworks, a more focused growth plan can be developed to move the Company toward its long-term objectives. Score a 5 here if detailed rolling 12-month sales plans are prepared and the plans are updated at least quarterly, but no long-term sales strategic frameworks or long-term objectives have been developed. Score above a 5 here if, in addition to rolling 12-month tactical sales plans, the Company also has adopted certain strategic framework positions as described above. Score below a 5 here if annual sales plans are not prepared on a rolling 12-month basis and/or are not updated on at least a quarterly basis.`,dimension:`Sales`,subarea:`Sales Strategy`,weight:8},{id:`sales-sales-strategy-is-the-strategy-aligned-with-overall-business-plan-mission-and-values`,text:`Is the strategy aligned with overall business plan, mission, and values?`,guidance:`The score here should not be higher than the score from the previous question but could be lower. A high score here would mean that the Company’s well-developed long-term and short-term marketing strategy is strongly aligned with the strategic frameworks of the overall Company and the other functional departments.`,dimension:`Sales`,subarea:`Sales Strategy`,weight:8},{id:`sales-sales-strategy-have-tactical-plans-been-developed-to-execute-the-strategy`,text:`Have tactical plans been developed to execute the strategy?`,guidance:`The score here should not be higher than the score from the previous question but could be lower. A high score here would mean that the Company’s well-developed long-term and short-term operating strategy is strongly aligned with the overall strategic frameworks of the Company AND short-term and long-term tactical plans have been fully developed to ensure execution and accountability. Do the tactical plans identify key drivers that will be tracked and managed? The score here should not be higher than the score from the previous question but could be lower. A high score here would mean that short-term and long-term tactical plans have been fully developed to ensure execution and accountability, AND that the Company has identified the 5 or 6 key drivers that will be closely tracked and managed in order to achieve overall goals. For products produced in-house, does the Company have a reliable supplier base? Score a 5 here if the Company has had long-term relationships with its key suppliers and is confident that such suppliers are financially healthy and capable of fulfilling the Company’s needs over the next several years. Score above a 5 to the extent the Company reviews...`,dimension:`Sales`,subarea:`Sales Strategy`,weight:8},{id:`sales-sales-strategy-are-the-tactical-plans-fully-reflected-incl-costs-in-budgets-and-project`,text:`Are the tactical plans fully reflected (incl. costs) in budgets and projections?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Sales`,subarea:`Sales Strategy`,weight:8},{id:`sales-sales-strategy-are-there-clearly-written-sales-objectives-by-salesperson`,text:`Are there clearly written sales objectives by salesperson?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Sales`,subarea:`Sales Strategy`,weight:8},{id:`sales-sales-strategy-describe-the-way-the-sales-team-approaches-its-objectives`,text:`Describe the way the sales team approaches its objectives.`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Sales`,subarea:`Sales Strategy`,weight:6},{id:`sales-sales-strategy-how-does-the-sales-team-approach-new-business-development`,text:`How does the sales team approach new business development?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Sales`,subarea:`Sales Strategy`,weight:8},{id:`sales-sales-operations-describe-the-way-the-company-s-sales-department-typically-functions`,text:`Describe the way the Company's sales department typically functions.`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Sales`,subarea:`Sales Operations`,weight:6},{id:`sales-sales-operations-describe-the-company-s-sales-planning-process-targets-forecasting-etc`,text:`Describe the Company's sales planning process (targets, forecasting, etc.).`,guidance:`Many companies prepare one-year sales plans as part of their annual budgeting process, and report overall monthly results against that plan but never update or revisit the plan throughout the year. Companies with highly effective sales planning processes have dedicated meetings at least on a monthly basis to review results, discuss what’s working and not working, what’s happening in the marketplace, what adjustments must be made to the sales plan, how that impacts the tactical plans, and how that might impact other functional departments within the Company. Score below a 5 here to the extent the Company’s sales planning process more closely resembles the annual process described above. Score above a 5 here to the extent the Company’s sales planning process more closely resembles the more rigorous monthly process described above.`,dimension:`Sales`,subarea:`Sales Operations`,weight:6},{id:`sales-sales-operations-describe-the-tracking-and-reporting-of-sales-results-against-targets-and`,text:`Describe the tracking and reporting of sales results against targets and forecasts.`,guidance:`This is a more granular version of question 1, above. Company’s with highly effective sales processes utilize Customer Resource Management (CRM) systems to track and manage the progress of customer prospects from the lead stage through the closing stage, and have established metrics for conversion rates and close rates that are used to evaluate and improve the sales process as well as to develop more predictable sales projections. A CRM system becomes a critical tool when fully utilized by the entire sales team and provides great predictive value to the entire company. Score above a 5 here if the Company manages its sales processes in the manner described above.`,dimension:`Sales`,subarea:`Sales Operations`,weight:6},{id:`sales-sales-operations-describe-the-relationship-between-sales-and-other-departments`,text:`Describe the relationship between Sales and other departments.`,guidance:`Companies with highly effective and balanced organizations practice active daily collaboration among the sales department and other functional departments, so the entire company can maintain visibility and balanced throughput of workflow. In companies where such active collaboration does not occur, it is usually a sign of either cultural conflicts or resource imbalances in one or more functional departments that prevent such collaboration and constrain the company’s growth. Score above a 5 here to the extent the Sales team practices active collaboration with all other functional departments of the Company, including marketing, operations, finance, H.R., etc. Score below a 5 here to the extent the Sales team operates more independently from other functions of the Company.`,dimension:`Sales`,subarea:`Sales Operations`,weight:6},{id:`sales-sales-operations-describe-the-sales-team-s-incentive-and-recognition-programs`,text:`Describe the sales team's incentive and recognition programs.`,guidance:`Companies with highly effective and balanced organizations practice active daily collaboration among the sales department and other functional departments, so the entire company can maintain visibility and balanced throughput of workflow. In companies where such active collaboration does not occur, it is usually a sign of either cultural conflicts or resource imbalances in one or more functional departments that prevent such collaboration and constrain the company’s growth. Score above a 5 here to the extent the Sales team practices active collaboration with all other functional departments of the Company, including marketing, operations, finance, H.R., etc. Score below a 5 here to the extent the Sales team operates more independently from other functions of the Company.`,dimension:`Sales`,subarea:`Sales Operations`,weight:6},{id:`sales-sales-operations-to-what-extent-are-incentives-designed-around-targets-and-goals`,text:`To what extent are incentives designed around targets and goals?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Sales`,subarea:`Sales Operations`,weight:8},{id:`sales-sales-projections-describe-the-sales-trends-over-the-last-three-years`,text:`Describe the sales trends over the last three years.`,guidance:`Score a 5 here if the annual sales trends over the last three years have been flat. Score a 6 here if the sales over the last three years have grown annually from 1%-5% Score a 7 here if the sales over the last three years have grown annually from 6%-10% Score an 8 here if the sales over the last three years have grown annually from 11%-15% Score a 9 here if the sales over the last three years have grown annually from 16%-20% Score a 10 here if the sales over the last three years have grown annually from 21%-25% Score a 4 here if the sales over the last three years have declined annually from 1%-5% Score a 3 here if the sales over the last three years have declined annually from 6%-10% Score a 2 here if the sales over the last three years have declined annually from 11%-15% Score a 1 here if the sales over the last three years have declined annually from 16%-20% Score a 0 here if the sales over the last three years have declined annually from 21%-25%`,dimension:`Sales`,subarea:`Sales Projections`,weight:6},{id:`sales-sales-projections-do-you-expect-sales-to-increase-or-decrease-next-year`,text:`Do you expect sales to increase or decrease next year?`,guidance:`Score a 5 here if you expect sales to be flat in the next 12 months. Score a 6 here if you expect sales to grow in the next 12 months by 1%-5% Score a 7 here if you expect sales to grow in the next 12 months by 6%-10% Score an 8 here if you expect sales to grow in the next 12 months by 11%-15% Score a 9 here if you expect sales to grow in the next 12 months by 16%-20% Score a 10 here if you expect sales to grow in the next 12 months by 21%-25% Score a 4 here if you expect sales to decline in the next 12 months by 1%-5% Score a 3 here if you expect sales to decline in the next 12 months by 6%-10% Score a 2 here if you expect sales to decline in the next 12 months by 11%-15% Score a 1 here if you expect sales to decline in the next 12 months by 16%-20% Score a 0 here if you expect sales to decline in the next 12 months by 21%-25%`,dimension:`Sales`,subarea:`Sales Projections`,weight:8},{id:`sales-sales-projections-do-you-expect-to-gain-market-share-in-the-next-year`,text:`Do you expect to gain market share in the next year?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Sales`,subarea:`Sales Projections`,weight:8},{id:`sales-sales-projections-are-projected-sales-reliant-on-new-types-of-products-services`,text:`Are projected sales reliant on new types of products/services?`,guidance:`Score a 10 here if the projected sales are based on the same sales mix as in prior years. For each 10% increment of a projected change in sales mix from prior years, reduce the score by 1. So, for example, if the sales mix is projected to include 20% of sales from a new product, the score would be 8 and if projected to be 60% from a new product, the score would be 4.`,dimension:`Sales`,subarea:`Sales Projections`,weight:8},{id:`sales-sales-projections-are-projected-sales-reliant-on-a-new-sales-mix-of-products-services`,text:`Are projected sales reliant on a new sales mix of products/services?`,guidance:`Score a 10 here if the projected sales are based on the same sales mix as in prior years. For each 10% increment of a projected change in sales mix from prior years, reduce the score by 1. So, for example, if the sales mix is projected to include 20% of sales from a new product, the score would be 8 and if projected to be 60% from a new product, the score would be 4.`,dimension:`Sales`,subarea:`Sales Projections`,weight:8},{id:`sales-sales-projections-are-sales-margins-projected-to-increase-or-decrease`,text:`Are sales margins projected to increase or decrease?`,guidance:`Score a 5 here if sales margin percentages are projected to be flat with last year Score a 10 here if sales margins are projected to increase by 5 percentage points or more Score a 0 here if sales margins are projected to decrease by 5 percentage points or more For each 1% increase or decrease of projected margins, increase or decrease the Score by 1 point from the middle point of 5.`,dimension:`Sales`,subarea:`Sales Projections`,weight:8},{id:`sales-sales-projections-can-sales-projections-be-achieved-with-the-existing-sales-team`,text:`Can sales projections be achieved with the existing sales team?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Sales`,subarea:`Sales Projections`,weight:8},{id:`sales-sales-projections-if-no-have-necessary-resources-been-factored-into-financial-projections`,text:`If "no", have necessary resources been factored into financial projections?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Sales`,subarea:`Sales Projections`,weight:8},{id:`sales-customer-base-do-you-expect-to-lose-any-customers-in-the-next-year`,text:`Do you expect to lose any customers in the next year?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Sales`,subarea:`Customer Base`,weight:8},{id:`sales-customer-base-do-projected-sales-rely-on-a-new-customer-base`,text:`Do projected sales rely on a new customer base?`,guidance:`Score a 10 here if the Company is confident that it will not lose any customers in the next year. Score a 0 here if the Company expects 100% new customers in the next year vs. last year. Starting at the 10 level, reduce the score by 1 for every 10% that new customers are expected to comprise in the next year.`,dimension:`Sales`,subarea:`Customer Base`,weight:8},{id:`sales-customer-base-describe-the-level-of-the-company-s-customer-concentration`,text:`Describe the level of the Company's customer concentration.`,guidance:`Score a 10 here if it would take 100 or more of the Company’s customers to account for 75% of sales. Score a 0 here if it would only take one customer to account for 75% of sales. For each increment of 10 fewer customers required to reach 75% of sales, decrease the score by 1 point from a starting point of 10. So, if it takes 50 customers to account for 75% of sales, the score would be a 5.`,dimension:`Sales`,subarea:`Customer Base`,weight:6},{id:`sales-customer-base-if-the-company-lost-its-top-customer-would-the-company-survive`,text:`If the Company lost its top customer, would the Company survive?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Sales`,subarea:`Customer Base`,weight:8},{id:`sales-customer-base-has-the-company-lost-customers-representing-10-of-sales-in-last-3-years`,text:`Has the Company lost customers representing > 10% of sales in last 3 years?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Sales`,subarea:`Customer Base`,weight:8},{id:`sales-customer-base-do-price-barriers-prevent-expansion-of-customer-base`,text:`Do price barriers prevent expansion of customer base?`,guidance:`The key here is to identify any/all factors that might cause it to lose new business and, therefore, be preventing the Company from expanding its customer base. These are all “Yes” or “No” questions.`,dimension:`Sales`,subarea:`Customer Base`,weight:8},{id:`sales-customer-base-do-product-quality-barriers-prevent-expansion-of-customer-base`,text:`Do product quality barriers prevent expansion of customer base?`,guidance:`The key here is to identify any/all factors that might cause it to lose new business and, therefore, be preventing the Company from expanding its customer base. These are all “Yes” or “No” questions.`,dimension:`Sales`,subarea:`Customer Base`,weight:8},{id:`sales-customer-base-do-service-quality-barriers-prevent-expansion-of-customer-base`,text:`Do service quality barriers prevent expansion of customer base?`,guidance:`The key here is to identify any/all factors that might cause it to lose new business and, therefore, be preventing the Company from expanding its customer base. These are all “Yes” or “No” questions.`,dimension:`Sales`,subarea:`Customer Base`,weight:8},{id:`sales-customer-base-do-proximity-to-customers-barriers-prevent-expansion-of-customer-base`,text:`Do proximity to customers barriers prevent expansion of customer base?`,guidance:`The key here is to identify any/all factors that might cause it to lose new business and, therefore, be preventing the Company from expanding its customer base. These are all “Yes” or “No” questions.`,dimension:`Sales`,subarea:`Customer Base`,weight:8},{id:`sales-customer-base-do-sales-resource-barriers-prevent-expansion-of-customer-base`,text:`Do sales resource barriers prevent expansion of customer base?`,guidance:`The key here is to identify any/all factors that might cause it to lose new business and, therefore, be preventing the Company from expanding its customer base. These are all “Yes” or “No” questions.`,dimension:`Sales`,subarea:`Customer Base`,weight:8},{id:`sales-customer-base-do-marketing-exposure-barriers-prevent-expansion-of-customer-base`,text:`Do marketing exposure barriers prevent expansion of customer base?`,guidance:`The key here is to identify any/all factors that might cause it to lose new business and, therefore, be preventing the Company from expanding its customer base. These are all “Yes” or “No” questions.`,dimension:`Sales`,subarea:`Customer Base`,weight:8},{id:`sales-customer-base-do-any-other-barriers-prevent-expansion-of-customer-base`,text:`Do any other barriers prevent expansion of customer base?`,guidance:`The key here is to identify any/all factors that might cause it to lose new business and, therefore, be preventing the Company from expanding its customer base. These are all “Yes” or “No” questions.`,dimension:`Sales`,subarea:`Customer Base`,weight:8}]},{id:`marketing`,name:`Marketing`,icon:Ce,subareas:[`Marketing Team`,`Marketing Strategy`,`Market Position`,`Market Branding`,`Marketing Financial Resources`],questions:[{id:`marketing-marketing-team-does-the-company-s-management-team-include-a-dedicated-marketing-executi`,text:`Does the Company's management team include a dedicated marketing executive?`,guidance:`The key word here is “dedicated”, meaning the executive’s exclusive responsibility is managing the marketing function for the Company. If the person who manages marketing also manages sales or another function, the answer here should be “No”. Remember that this is not a size dependent questionnaire, so it doesn’t necessarily mean the Company should have a “dedicated” marketing executive at the Company’s current stage but, as the Company grows, it will likely need a dedicated marketing leader at some point, which is a best practice standard.`,dimension:`Marketing`,subarea:`Marketing Team`,weight:8},{id:`marketing-marketing-team-is-there-a-marketing-team-in-addition-to-or-in-lieu-of-an-executive`,text:`Is there a marketing team in addition to, or in lieu of, an executive?`,guidance:`If the Company’s marketing leader also leads other functions, that leader would be considered part of the marketing team rather than a “dedicated” marketing executive. If the Company utilizes an outside marketing firm or other outsourced marketing functions, they would also count as part of the marketing team.`,dimension:`Marketing`,subarea:`Marketing Team`,weight:8},{id:`marketing-marketing-team-describe-executive-s-team-s-experience-specifically-marketing-the-compan`,text:`Describe executive's / team's experience specifically marketing the Company's products / services.`,guidance:`Equate the score here to the marketing leader’s (or team’s) level of expertise in developing measurable strategic and tactical marketing programs specifically for the Company’s products including branding, messaging, differentiation, competitive analysis and pricing, market positioning and placement, etc. A “10” here would mean the marketing leader is a recognized expert and/or thought leader in the Company’s industry and has developed proven programs to drive revenue for the Company.`,dimension:`Marketing`,subarea:`Marketing Team`,weight:6},{id:`marketing-marketing-team-describe-executive-s-team-s-expertise-in-general-marketing-practices`,text:`Describe executive's / Team's expertise in general marketing practices.`,guidance:`Equate the score here to the extent to which the marketing leader (or team) is on the cutting edge of general marketing approaches and technologies, such as CRM systems, social media, analytics, SEO, etc., and actively participates in marketing industry trade associations or other marketing educational venues in order to stay at the forefront of what technologies are available and working for others.`,dimension:`Marketing`,subarea:`Marketing Team`,weight:6},{id:`marketing-marketing-team-to-what-extent-does-marketing-actively-support-the-sales-effort`,text:`To what extent does marketing actively support the sales effort?`,guidance:`A high score here would mean that the marketing team is tightly aligned with the sales team and has a formal process of communication and collaboration with the sales team in a process to identify, quality, cultivate, and convert prospective new customers to become actual new customers. Score a 5 here if the marketing team maintains a loose process for supporting the sales function. Score above a 5 to the extent the marketing team has a more formalized process of supporting the sales function. Score below a 5 to the extent the marketing team has only a haphazard approach, if any, to actively supporting the sales function.`,dimension:`Marketing`,subarea:`Marketing Team`,weight:8},{id:`marketing-marketing-strategy-does-the-company-have-a-clearly-written-and-adopted-marketing-strategy`,text:`Does the Company have a clearly written and adopted marketing strategy?`,guidance:`Many companies prepare one-year marketing plans as part of their annual budgeting process. That activity is considered more tactical than strategic and would not meet the standard of a written marketing strategy. A full marketing strategy would include a 3-5-year outlook of how the Company wants to be positioned within its industry in terms of certain strategic frameworks such as the Value Disciplines Model and Bowman’s Strategy Clock, and what branding, messaging, and tactical plans must be developed to achieve the desired positioning. Tight alignment, collaboration, and discipline with the sales team must exist in order to be most effective. Score a 5 here if detailed rolling 12-month marketing plans are prepared and the plans are updated at least quarterly, but no long-term marketing strategic frameworks or long-term positioning objectives have been developed. Score above a 5 here if, in addition to rolling 12-month tactical marketing plans, the Company also has adopted certain strategic framework positions as described above. Score below a 5 here if annual marketing plans are not prepared on a rolling 12-month basis and/or are not updated on at least a quarterly basis.`,dimension:`Marketing`,subarea:`Marketing Strategy`,weight:8},{id:`marketing-marketing-strategy-is-the-strategy-aligned-with-overall-business-plan-mission-and-values`,text:`Is the strategy aligned with overall business plan, mission, and values?`,guidance:`The score here should not be higher than the score from the previous question but could be lower. A high score here would mean that the Company’s well-developed long-term and short-term marketing strategy is strongly aligned with the strategic frameworks of the overall Company and the other functional departments.`,dimension:`Marketing`,subarea:`Marketing Strategy`,weight:8},{id:`marketing-marketing-strategy-have-tactical-plans-been-developed-to-execute-the-strategy`,text:`Have tactical plans been developed to execute the strategy?`,guidance:`The score here should not be higher than the score from the previous question but could be lower. A high score here would mean that the Company’s well-developed long-term and short-term operating strategy is strongly aligned with the overall strategic frameworks of the Company AND short-term and long-term tactical plans have been fully developed to ensure execution and accountability. Do the tactical plans identify key drivers that will be tracked and managed? The score here should not be higher than the score from the previous question but could be lower. A high score here would mean that short-term and long-term tactical plans have been fully developed to ensure execution and accountability, AND that the Company has identified the 5 or 6 key drivers that will be closely tracked and managed in order to achieve overall goals. For products produced in-house, does the Company have a reliable supplier base? Score a 5 here if the Company has had long-term relationships with its key suppliers and is confident that such suppliers are financially healthy and capable of fulfilling the Company’s needs over the next several years. Score above a 5 to the extent the Company reviews...`,dimension:`Marketing`,subarea:`Marketing Strategy`,weight:8},{id:`marketing-marketing-strategy-has-the-company-clearly-defined-its-target-market`,text:`Has the Company clearly defined its target market?`,guidance:`A target market could be a geographical market that spans multiple end-industries or a vertical industry (or industries) that spans multiple geographical markets. The key is to define the target market as specifically as possible so the marketing and sales efforts can be highly focused and proactive in penetrating that market. Without a highly defined target market a lot of wasted effort and resources may occur by either being reactive or allocating resources to market segments that are not strategic. Who is the ideal customer? How big are they? How do they make purchase decisions? How often and how much do they purchase? The more specifically the target market is defined, the more effective the Company’s marketing strategy can become. Score a 5 here if the Company has a loosely defined target market but is equally likely to be reactive to prospective customer inquiries as it is to proactively reach out to ideal target customers in order to establish specific relationships. Score above a 5 here to the extent the Company’s target market is more highly defined and its marketing and sales efforts are more proactive in outreaching to ideal target customers. Score below a 5...`,dimension:`Marketing`,subarea:`Marketing Strategy`,weight:8},{id:`marketing-marketing-strategy-how-effective-is-the-process-of-marketing-driving-qualified-leads-to-sal`,text:`How effective is the process of Marketing driving qualified leads to Sales?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Marketing`,subarea:`Marketing Strategy`,weight:8},{id:`marketing-market-position-describe-the-company-s-competitive-analysis-process`,text:`Describe the Company's competitive analysis process.`,guidance:`A high score here would indicate that the Company maintains a current detailed analysis of all competitors including such factors as their specific positioning and differentiation in the market, their pricing, their target markets and target customer profiles, their relative sizes and growth trajectories, and how all those factors compare to those of the Company. Score a 5 here if the Company has a loose / informal process for staying abreast of the competitive landscape but has a lot of room for improvement and more structure. Score above a 5 here to the extent the Company has a more structured process moving toward formalization with continuous improvement and on par with best-in-class companies Score below a 5 here to the extent the Company has less than a loosely structured competitive analysis process or does no competitive analysis at all.`,dimension:`Marketing`,subarea:`Market Position`,weight:6},{id:`marketing-market-position-describe-the-company-s-pricing-strategy`,text:`Describe the Company's pricing strategy.`,guidance:`Score a 5 here if the Company’s products are priced at the same level as competing products. Score above a 5 to the extent the Company’s products are priced at a premium to competing products Score below a 5 to the extent the Company’s products are value priced compared to competing products.`,dimension:`Marketing`,subarea:`Market Position`,weight:6},{id:`marketing-market-position-describe-how-pricing-is-determined`,text:`Describe how pricing is determined.`,guidance:`Some companies price their products in a cost-plus manner, targeting a specific margin that is generally low in a relatively commoditized market. Companies at the other end of the spectrum price their products at a premium to all other competing products based on what the market will bear for their differentiated product attributes, typically generating higher margins than the industry. Score above a 5 to the extent the Company prices its products at a premium to the industry based on its differentiated product attributes. Score below a 5 to the extent the Company prices its products based on a cost-plus approach in a more commoditized market position.`,dimension:`Marketing`,subarea:`Market Position`,weight:6},{id:`marketing-market-position-has-marketing-defined-the-desired-customer-experience`,text:`Has Marketing defined the desired customer experience?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Marketing`,subarea:`Market Position`,weight:8},{id:`marketing-market-position-are-actual-customer-experiences-monitored-and-tracked`,text:`Are actual customer experiences monitored and tracked?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Marketing`,subarea:`Market Position`,weight:8},{id:`marketing-market-position-are-company-competitive-advantages-identified-and-marketed`,text:`Are Company competitive advantages identified and marketed?`,guidance:`Score a 5 here if the Company has a loose process for defining and marketing its competitive advantages. Score above a 5 to the extent the Company has a more structured approach, moving toward formalization, for identifying, marketing, and even exploiting its competitive advantages. Score below a 5 to the extent the Company only pays haphazard attention, or none at all, to identifying and marketing its competitive advantages.`,dimension:`Marketing`,subarea:`Market Position`,weight:8},{id:`marketing-market-branding-are-standard-proposal-templates-utilized-to-articulate-the-company-s-val`,text:`Are standard proposal templates utilized to articulate the Company's value and promote its brand?`,guidance:`Score a 5 here if the Company has a loose process for ensuring that standard proposal templates are consistently utilized and that they articulate the Company’s value and promote its brand. Score higher than a 5 to the extent the Company’s process is more structured and moving toward formalization of standard proposal templates. Score below a 5 to the extent the Company has more of a haphazard approach, or no approach, to ensuring that its proposal templates are all consistent and articulate the Company’s value and brand.`,dimension:`Marketing`,subarea:`Market Branding`,weight:8},{id:`marketing-market-branding-is-the-company-s-brand-clear-and-used-consistently-web-brochures-bus-car`,text:`Is the Company's brand clear and used consistently (web, brochures, bus cards, etc.)`,guidance:`Score a 5 here if the Company has a loose process for refining and using its brand clearly and consistently in all its collateral material and advertising. Score above a 5 to the extent the Company has a more structured process, moving toward a formal process, for having a highly defined and consistently used brand in the marketplace. Score below a 5 to the extent the Company gives haphazard consideration, or no consideration, to refining and consistently using its brand in the marketplace. How effective is the Company's website as a marketing tool? Score a 5 here if the Company has a loose process for ensuring that its website is effectively functioning as a marketing tool. Score above a 5 to the extent the Company has a more structured process, moving toward a formal process, for ensuring that its website is functioning at a high level in driving qualified leads to the Company. Score below a 5 to the extent the Company pays haphazard attention, or no attention, to its website and relies more on other means of attracting and cultivating current and prospective customers.`,dimension:`Marketing`,subarea:`Market Branding`,weight:6},{id:`marketing-market-branding-how-effective-is-the-company-s-website-and-social-media-presence`,text:`How effective is the Company's website and social media presence?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Marketing`,subarea:`Market Branding`,weight:8},{id:`marketing-market-branding-how-effective-are-the-company-s-collateral-materials-as-marketing-tools`,text:`How effective are the Company's collateral materials as marketing tools?`,guidance:`Score a 5 here if the Company has a loose process for ensuring that its collateral materials are effectively functioning as marketing tools. Score above a 5 to the extent the Company has a more structured process, moving toward a formal process, for ensuring that its collateral materials are functioning at a high level in driving qualified leads to the Company. Score below a 5 to the extent the Company pays haphazard attention, or no attention, to its collateral materials and relies more on other means of attracting and cultivating current and prospective customers. Is there a formal financial budget for marketing? A “Yes” answer here implies that the Company has a marketing budget that includes details about how, where, and when it will be invested and what results are expected to be generated by it. Does the budget reflect the full marketing strategy? A “Yes” answer here implies that the Company actually has a fully developed marketing strategy that it is following as part of an overall Company strategic plan. If no such marketing strategy exists or it is incomplete, a “No” answer should be entered here. Describe marketing spending trends in last three years. Score a 5...`,dimension:`Marketing`,subarea:`Market Branding`,weight:8},{id:`marketing-marketing-financial-resources-are-standard-proposal-templates-utilized-to-articulate-the-company-s-val`,text:`Are standard proposal templates utilized to articulate the Company's value and promote its brand?`,guidance:`Score a 5 here if the Company has a loose process for ensuring that standard proposal templates are consistently utilized and that they articulate the Company’s value and promote its brand. Score higher than a 5 to the extent the Company’s process is more structured and moving toward formalization of standard proposal templates. Score below a 5 to the extent the Company has more of a haphazard approach, or no approach, to ensuring that its proposal templates are all consistent and articulate the Company’s value and brand.`,dimension:`Marketing`,subarea:`Marketing Financial Resources`,weight:8},{id:`marketing-marketing-financial-resources-is-the-company-s-brand-clear-and-used-consistently-web-brochures-bus-car`,text:`Is the Company's brand clear and used consistently (web, brochures, bus cards, etc.)`,guidance:`Score a 5 here if the Company has a loose process for refining and using its brand clearly and consistently in all its collateral material and advertising. Score above a 5 to the extent the Company has a more structured process, moving toward a formal process, for having a highly defined and consistently used brand in the marketplace. Score below a 5 to the extent the Company gives haphazard consideration, or no consideration, to refining and consistently using its brand in the marketplace. How effective is the Company's website as a marketing tool? Score a 5 here if the Company has a loose process for ensuring that its website is effectively functioning as a marketing tool. Score above a 5 to the extent the Company has a more structured process, moving toward a formal process, for ensuring that its website is functioning at a high level in driving qualified leads to the Company. Score below a 5 to the extent the Company pays haphazard attention, or no attention, to its website and relies more on other means of attracting and cultivating current and prospective customers.`,dimension:`Marketing`,subarea:`Marketing Financial Resources`,weight:6},{id:`marketing-marketing-financial-resources-how-effective-is-the-company-s-website-and-social-media-presence`,text:`How effective is the Company's website and social media presence?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`Marketing`,subarea:`Marketing Financial Resources`,weight:8},{id:`marketing-marketing-financial-resources-how-effective-are-the-company-s-collateral-materials-as-marketing-tools`,text:`How effective are the Company's collateral materials as marketing tools?`,guidance:`Score a 5 here if the Company has a loose process for ensuring that its collateral materials are effectively functioning as marketing tools. Score above a 5 to the extent the Company has a more structured process, moving toward a formal process, for ensuring that its collateral materials are functioning at a high level in driving qualified leads to the Company. Score below a 5 to the extent the Company pays haphazard attention, or no attention, to its collateral materials and relies more on other means of attracting and cultivating current and prospective customers. Is there a formal financial budget for marketing? A “Yes” answer here implies that the Company has a marketing budget that includes details about how, where, and when it will be invested and what results are expected to be generated by it. Does the budget reflect the full marketing strategy? A “Yes” answer here implies that the Company actually has a fully developed marketing strategy that it is following as part of an overall Company strategic plan. If no such marketing strategy exists or it is incomplete, a “No” answer should be entered here. Describe marketing spending trends in last three years. Score a 5...`,dimension:`Marketing`,subarea:`Marketing Financial Resources`,weight:8}]},{id:`people`,name:`People`,icon:Oe,subareas:[`Organizational Structure`,`Organizational Strategy`,`Continuous`,`Incentive Programs`,`People Policies & Procedures`,`Ability To Scale Organization`],questions:[{id:`people-organizational-structure-does-the-company-s-management-team-include-a-dedicated-h-r-leader`,text:`Does the Company's management team include a dedicated H.R. leader?`,guidance:`The key word here is “dedicated”, meaning the executive’s exclusive responsibility is managing the marketing function for the Company. If the person who manages marketing also manages sales or another function, the answer here should be “No”. Remember that this is not a size dependent questionnaire, so it doesn’t necessarily mean the Company should have a “dedicated” marketing executive at the Company’s current stage but, as the Company grows, it will likely need a dedicated marketing leader at some point, which is a best practice standard.`,dimension:`People`,subarea:`Organizational Structure`,weight:8},{id:`people-organizational-structure-does-the-company-have-a-current-written-formal-organizational-chart`,text:`Does the Company have a current written formal organizational chart?`,guidance:`The most effective organizational charts are created around positions rather than around specific people. Key words here include “current” and “written”. Score a 5 here if the Company has a written organizational chart that either needs to be updated or was created around people rather than around positions. Score above a 5 to the extent the Company has a written organizational chart that is current, was developed around positions rather than around people, and has been clearly communicated to, and is understood by, all employees. Score below a 5 to the extent the Company has no written organizational chart or has one that is neither current nor developed around positions rather than around people.`,dimension:`People`,subarea:`Organizational Structure`,weight:8},{id:`people-organizational-structure-has-the-organizational-chart-been-shared-with-all-employees`,text:`Has the organizational chart been shared with all employees?`,guidance:`Score from 0 to 10 based on how developed, documented, current, consistently used, and transferable this capability is.`,dimension:`People`,subarea:`Organizational Structure`,weight:8},{id:`people-organizational-structure-has-the-company-developed-clear-job-descriptions-for-every-position`,text:`Has the Company developed clear job descriptions for every position?`,guidance:`Score a 5 here if the Company has written job descriptions for some positions in the Company but they are either not current or do not include all positions. Score above a 5 to the extent
